instances:
  - url: topograph.docs.buildwithfern.com/topograph
    custom-domain: docs.nvidia.com/topograph
    multi-source: true
title: NVIDIA Topograph
global-theme: nvidia
metadata:
  canonical-host: "docs.nvidia.com/topograph"
products:
  - display-name: Topograph
    slug: /
    path: ../docs/index.yml
    versions:
      - display-name: v1.1.0
        path: versions/v1.1.0.yml
        slug: v1.1.0
        availability: stable
      - display-name: v1.0.0
        path: versions/v1.0.0.yml
        slug: v1.0.0
        availability: stable
      - display-name: v0.5.0
        path: versions/v0.5.0.yml
        slug: v0.5.0
        availability: stable
redirects:
  - source: "/topograph/index.html"
    destination: "/topograph/"
logo:
  href: /topograph
  right-text: Topograph
navbar-links:
  - type: github
    value: https://github.com/dsx-ai-factory/topograph
