# Labels that the issue forms, .github/labeler.yml, and workflow scripts apply.
# Nothing syncs this file to GitHub: a maintainer creates each label once, and
# a change that applies a new label adds it here in the same PR.
# .github/tests/labels.test.mjs fails when a form, labeler.yml, or a workflow
# script names a label that is not listed here.
#
# Each entry is a name, a color as a quoted 6-digit hex string without `#`,
# and a description. Colors and descriptions match the labels as they exist on
# GitHub today.

- name: bug
  color: "d73a4a"
  description: "Something isn't working"

- name: enhancement
  color: "a2eeef"
  description: "New feature or request"

- name: documentation
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: question
  color: "d876e3"
  description: "Further information is requested"

- name: needs-triage
  color: "fbca04"
  description: "New issue a maintainer has not triaged yet"
- name: needs-rebase
  color: "e11d21"
  description: "Conflicts with main; the author needs to rebase or merge main"

- name: lifecycle/stale
  color: "ededed"
  description: "No activity for a while; see Following up in CONTRIBUTING.md"

- name: lifecycle/frozen
  color: "0e8a16"
  description: "Exempt from the stale label, idle reminders and closing"
