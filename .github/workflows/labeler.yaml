# Labels each pull request when it is opened, pushed to, or reopened:
#   area/*  from the paths it changes, by actions/labeler with the map in
#           .github/labeler.yml. sync-labels removes an area/* label once the
#           pull request no longer touches that area.
#   size/*  from additions plus deletions: XS under 10, S under 50, M under
#           200, L under 500, XL otherwise. Any other size/* label is removed.
#
# Why pull_request_target: a pull_request run from a fork gets a read-only
# token, so it could not label. pull_request_target runs this file as it is on
# the base branch, with the base repository's token, so the job checks out no
# code and runs nothing from the pull request: the labeler lists the changed
# files and reads .github/labeler.yml through the API at the base branch's
# commit, and the size step reads only the line counts and labels. zizmor
# reports the trigger as dangerous-triggers; workflow-lint.yaml lists it as
# accepted.
#
# GitHub blocks pull_request_target in public repositories from 2026-12-02
# unless an Actions policy allows it. This workflow needs the repository-level
# policy that allows it for this file (P0 of the governance program) in place
# before that date, or it stops running.
#
# Runs for the same pull request share a concurrency group and a new one
# cancels the one in progress, so labels from an older push never land after
# a newer push's. Each run recomputes every label, so a cancelled run loses
# nothing.
#
# Permissions: the labeler reads .github/labeler.yml with contents read.
# Listing changed files, reading labels and adding or removing them need
# pull-requests write; the label calls go through the issues endpoints, which
# accept it on a pull request. That token cannot create a label, so every
# area/* and size/* label must exist (they are declared in .github/labels.yml);
# if one does not, the step that applies it fails, and so does the job.

name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Nothing at the workflow level; the job declares what it uses.
permissions: {}

jobs:
  label:
    name: Label by area and size
    # Upstream only, so a fork with Actions enabled never labels its own pull
    # requests.
    if: github.repository == 'dsx-ai-factory/topograph'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the labeler reads .github/labeler.yml from the base branch through the API
      pull-requests: write # list changed files, read the labels, add and remove area/* and size/* labels
    steps:
      - name: Label by changed paths
        id: paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

      - name: Label by size
        id: size
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const changed = pr.additions + pr.deletions;
            let size;
            if (changed < 10) size = 'size/XS';
            else if (changed < 50) size = 'size/S';
            else if (changed < 200) size = 'size/M';
            else if (changed < 500) size = 'size/L';
            else size = 'size/XL';

            const { owner, repo } = context.repo;
            const issue_number = pr.number;

            // Read the labels as they are now, not from the event: they may
            // have changed since it fired, for example when a run for an
            // earlier push finished after this one was queued.
            const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            const names = current.labels.map((label) => label.name);

            // Add before removing, so a failed add (the label was never
            // created) fails the job with the old size label still on. Not
            // caught: a missing label must fail the job.
            if (names.includes(size)) {
              core.info(`${changed} lines changed, ${size} already set`);
            } else {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [size] });
              core.info(`${changed} lines changed, added ${size}`);
            }
            for (const name of names) {
              if (name.startsWith('size/') && name !== size) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                core.info(`removed ${name}`);
              }
            }
