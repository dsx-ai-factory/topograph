# Checks that the pull request description fills in the parts of
# .github/PULL_REQUEST_TEMPLATE.md that a reviewer reads before the diff:
#   - Summary is not empty;
#   - Linked issue has "Fixes: #N" or "Related: #N" (also as
#     dsx-ai-factory/topograph#N or the issue URL), or a ticked "Trivial fix"
#     box for a change CONTRIBUTING.md "Open an issue first" exempts;
#   - at least one Type of change box is ticked;
#   - Testing is not empty.
# HTML comments are removed first, and the template's guidance is all in HTML
# comments, so a section left as the template has it counts as empty. Each
# missing part becomes one error annotation and one line in the job summary;
# the job posts no comment. Pull requests opened by a bot account are skipped,
# because Dependabot cannot fill in a template. `user.type` comes from the
# account that opened the pull request, not from commit metadata, so a person
# cannot set it to "Bot".
#
# It reports; it does not yet gate. Maintainers make it required by adding
# `PR description` (this job's name) to the required status checks of the
# `main-enforced` ruleset. The ruleset matches checks by name, so renaming the
# job would silently drop it from there.
#
# The trigger is pull_request_target, not pull_request, so that a pull request
# from a fork is checked without a maintainer approving the run. This
# repository holds every outside contributor's pull_request runs for approval,
# and each edit to the description would start a new run that waits again.
# pull_request_target runs in the base repository's context instead, so the
# job is limited to what that context cannot misuse:
#   - `permissions: {}` on the workflow and on the job, so the token can do
#     nothing (pinned by pr-description.test.mjs);
#   - no actions/checkout and no actions/cache, so no code or cache from the
#     pull request reaches the runner;
#   - no reference to the secrets context anywhere in this file;
#   - the body reaches the script only through the BODY environment variable,
#     never through an expression inside the script, and the script never
#     prints it.
# .github/tests/security-invariants.test.mjs enforces the last three for every
# pull_request_target workflow. The injection fixture in pr-description.test.mjs
# shows that $(...), backticks, expressions and workflow commands in the body
# are read as plain text. GitHub blocks pull_request_target in public
# repositories by default from December 2, 2026, unless an Actions policy
# allows it, so this workflow needs that policy to keep running after then.
#
# pull_request_target runs the workflow file from the base branch, so a pull
# request that edits this file is checked by the version on main, not by its
# own copy. A change here takes effect only once it merges.
#
# `edited` re-runs the check when the description changes, which does not
# move the head commit. `synchronize` re-runs it on a push, although a push
# does not change the description, because a required check is reported per
# head commit and a new head with no run would have no result. `edited` also
# fires on title and base changes. Every run does the full check rather than
# skipping when the description did not change: a skipped job reports success
# under this check's name, which would replace a failing result with a pass.
#
# Runner: GitHub-hosted ubuntu-latest. Any
# GitHub user can start this job by opening a pull request, and it only reads
# the event payload, so it has no reason to run on, or queue for, the
# project's own machines. The repository guard keeps copies of this workflow
# in forks from running there.

name: PR Description

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-description:
    name: PR description
    if: github.repository == 'dsx-ai-factory/topograph'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The check reads only the event payload and calls no API.
    permissions: {}

    steps:
      - name: Check the description follows the template
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BODY: ${{ github.event.pull_request.body }}
        with:
          script: |
            if (context.payload.pull_request.user.type === 'Bot') {
              core.notice('Skipped: pull request opened by a bot account.');
              return;
            }

            // GitHub sends a null body for an empty description, which BODY
            // receives as an empty string. Descriptions edited on github.com
            // arrive with CRLF line endings. The template's guidance is in
            // HTML comments, which do not render, so they count as empty.
            const body = (process.env.BODY ?? '')
              .replace(/\r\n/g, '\n')
              .replace(/<!--[\s\S]*?-->/g, '');

            // A section runs from its "## " heading to the next one. Headings
            // compare case-insensitively; a repeated heading adds to the same
            // section. Text before the first heading belongs to none.
            const sections = new Map();
            let current = null;
            for (const line of body.split('\n')) {
              const heading = line.match(/^##\s+(.+?)\s*$/);
              if (heading) {
                current = heading[1].toLowerCase();
              } else if (current !== null) {
                sections.set(current, `${sections.get(current) ?? ''}${line}\n`);
              }
            }
            const section = (name) => (sections.get(name) ?? '').trim();

            const issueLink =
              /^(fixes|related):\s*(#\d+|dsx-ai-factory\/topograph#\d+|https:\/\/github\.com\/dsx-ai-factory\/topograph\/issues\/\d+)\b/im;
            const trivialFix = /^- \[[xX]\] Trivial fix/m;
            const ticked = /^- \[[xX]\] /m;

            const failures = [];
            if (!section('summary')) {
              failures.push('Summary is empty or missing.');
            }
            const linkedIssue = section('linked issue');
            if (!issueLink.test(linkedIssue) && !trivialFix.test(linkedIssue)) {
              failures.push(
                'Linked issue: add "Fixes: #N" or "Related: #N", or tick "Trivial fix" when CONTRIBUTING.md exempts the change.',
              );
            }
            if (!ticked.test(section('type of change'))) {
              failures.push('Type of change: tick at least one box.');
            }
            if (!section('testing')) {
              failures.push('Testing is empty or missing.');
            }

            if (failures.length === 0) {
              core.info('The pull request description has every required part.');
              return;
            }
            for (const failure of failures) {
              core.error(failure, { title: 'PR description' });
            }
            await core.summary
              .addHeading('The pull request description is incomplete', 3)
              .addList(failures)
              .addRaw(
                '<p>Edit the pull request description to fill in each part listed above. Saving the edit re-runs this check.</p>',
                true,
              )
              .write();
            core.setFailed('The pull request description is incomplete; see the job summary.');
