name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: helm-repository-publication
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Publish release
    runs-on: linux-amd64-cpu8
    permissions:
      # Push the chart's SLSA provenance to the registry and create its
      # artifact metadata storage record (actions/attest with push-to-registry).
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      # Push the chart, its cosign signature, and its provenance to GHCR.
      packages: write
    env:
      # Fulcio certificate identity of this workflow at an official release
      # tag. RELEASE.md documents the same expression for users.
      CHART_SIGNER_IDENTITY_REGEXP: '^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vX.Y.Z; got ${RELEASE_TAG}"
            exit 1
          fi

          if [[ "${GITHUB_REF}" != "refs/tags/${RELEASE_TAG}" ]]; then
            echo "::error::Run this workflow from tag ${RELEASE_TAG} so attestations identify the canonical tag."
            echo "::error::Retry with: gh workflow run release.yml --ref ${RELEASE_TAG} -f tag=${RELEASE_TAG}"
            exit 1
          fi

          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          checkout_commit=$(git rev-parse HEAD)
          if [[ "${tag_commit}" != "${checkout_commit}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} resolves to ${tag_commit}, but checkout is ${checkout_commit}."
            exit 1
          fi

          version=${RELEASE_TAG#v}
          chart_version=$(awk '$1 == "version:" {gsub(/"/, "", $2); print $2; exit}' charts/topograph/Chart.yaml)
          app_version=$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2; exit}' charts/topograph/Chart.yaml)

          if [[ "${chart_version}" != "${version}" ]]; then
            echo "::error::Chart version ${chart_version} does not match release version ${version}."
            exit 1
          fi
          if [[ "${app_version}" != "${RELEASE_TAG}" ]]; then
            echo "::error::Chart appVersion ${app_version} does not match release tag ${RELEASE_TAG}."
            exit 1
          fi

          awk -v heading="## [${version}]" '
            index($0, heading) == 1 && (length($0) == length(heading) || substr($0, length(heading) + 1, 3) == " - ") {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]] || ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no release notes for ${version}."
            exit 1
          fi

          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - name: Package Helm chart
        run: |
          mkdir -p packaged
          helm lint charts/topograph
          helm package charts/topograph --destination packaged

      - name: Generate SHA-256 checksum
        env:
          CHART: packaged/topograph-${{ steps.release.outputs.version }}.tgz
        run: |
          set -euo pipefail
          cd "$(dirname "${CHART}")"
          chart=$(basename "${CHART}")
          sha256sum "${chart}" > "${chart}.sha256"
          sha256sum --check "${chart}.sha256"

      - name: Generate SLSA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packaged/topograph-${{ steps.release.outputs.version }}.tgz

      # cosign and actions/attest read registry credentials from the Docker
      # config this step writes, and helm push falls back to the same file, so
      # no separate helm registry login is needed. The action logs out again in
      # its post step.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm chart to GHCR
        id: oci
        env:
          CHART: packaged/topograph-${{ steps.release.outputs.version }}.tgz
          CHART_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          # OCI repository names must be lowercase.
          chart_repo="ghcr.io/${GITHUB_REPOSITORY,,}/charts"
          subject_name="${chart_repo}/topograph"

          # helm push writes the Pushed: and Digest: lines to stderr.
          if ! push_output=$(helm push "${CHART}" "oci://${chart_repo}" 2>&1); then
            printf '%s\n' "${push_output}"
            echo "::error::helm push to oci://${chart_repo} failed."
            exit 1
          fi
          printf '%s\n' "${push_output}"

          # OCI tags cannot contain '+', so Helm stores SemVer build metadata
          # with '_' instead.
          expected_ref="${subject_name}:${CHART_VERSION//+/_}"
          pushed_ref=$(awk '$1 == "Pushed:" {print $2}' <<< "${push_output}")
          if [[ "${pushed_ref}" != "${expected_ref}" ]]; then
            echo "::error::Expected helm push to report ${expected_ref}; got '${pushed_ref}'."
            exit 1
          fi
          digest=$(awk '$1 == "Digest:" {print $2}' <<< "${push_output}")
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not parse a sha256 digest from the helm push output; got '${digest}'."
            exit 1
          fi

          echo "subject-name=${subject_name}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign and verify GHCR Helm chart
        uses: ./.github/actions/cosign-sign-oci-artifact
        with:
          subject-name: ${{ steps.oci.outputs.subject-name }}
          subject-digest: ${{ steps.oci.outputs.digest }}
          certificate-identity-regexp: ${{ env.CHART_SIGNER_IDENTITY_REGEXP }}

      - name: Generate SLSA provenance for GHCR Helm chart
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.oci.outputs.subject-name }}
          subject-digest: ${{ steps.oci.outputs.digest }}
          push-to-registry: true

      # Uses the cosign that the sign action installed. --new-bundle-format
      # matches the layout actions/attest pushes to the registry.
      - name: Verify GHCR Helm chart provenance
        env:
          SUBJECT: ${{ steps.oci.outputs.subject-name }}@${{ steps.oci.outputs.digest }}
        run: |
          set -euo pipefail
          timeout --foreground 120s cosign verify-attestation \
            --type slsaprovenance1 \
            --certificate-identity-regexp "${CHART_SIGNER_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --new-bundle-format=true \
            "${SUBJECT}" > /dev/null
          echo "Verified the SLSA provenance on ${SUBJECT}"

      - name: Fetch existing Helm repository index
        run: |
          set -euo pipefail
          if ! remote_ref=$(git ls-remote --heads origin refs/heads/gh-pages); then
            echo "::error::Failed to check for the existing gh-pages branch."
            exit 1
          fi
          if [[ -n "${remote_ref}" ]]; then
            git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git checkout origin/gh-pages -- index.yaml
          fi

      - name: Generate Helm repository index
        # Pass context values through env rather than expanding ${{ }} inside
        # the script, so the shell never parses them as code.
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ -f index.yaml ]]; then
            helm repo index packaged \
              --url "https://${REPO_OWNER}.github.io/${REPO_NAME}" \
              --merge index.yaml
          else
            helm repo index packaged \
              --url "https://${REPO_OWNER}.github.io/${REPO_NAME}"
          fi

      - name: Deploy Helm repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          keep_files: true
          publish_branch: gh-pages
          publish_dir: ./packaged

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: |
            packaged/topograph-${{ steps.release.outputs.version }}.tgz
            packaged/topograph-${{ steps.release.outputs.version }}.tgz.sha256
          prerelease: false
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
