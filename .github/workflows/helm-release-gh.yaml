name: Release Helm Charts GH

on: workflow_dispatch

concurrency:
  group: helm-repository-publication
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: linux-amd64-cpu8
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - name: Package Helm chart
        run: |
          mkdir -p packaged
          helm lint charts/topograph
          helm package charts/topograph --destination packaged

      - name: Generate SHA-256 checksum
        run: |
          set -euo pipefail
          cd packaged
          for chart in topograph-*.tgz; do
            sha256sum "${chart}" > "${chart}.sha256"
            sha256sum --check "${chart}.sha256"
          done

      - name: Generate SLSA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packaged/topograph-*.tgz

      - name: Fetch existing Helm repo index
        run: |
          set -euo pipefail
          if ! remote_ref=$(git ls-remote --heads origin refs/heads/gh-pages); then
            echo "::error::Failed to check for the existing gh-pages branch."
            exit 1
          fi
          if [[ -n "${remote_ref}" ]]; then
            git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git checkout origin/gh-pages -- index.yaml
          fi

      - name: Generate Helm repo index
        # Pass context values through env rather than expanding ${{ }} inside
        # the script, so the shell never parses them as code.
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -f index.yaml ]; then
            helm repo index packaged --url "https://${REPO_OWNER}.github.io/${REPO_NAME}" --merge index.yaml
          else
            helm repo index packaged --url "https://${REPO_OWNER}.github.io/${REPO_NAME}"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./packaged
          publish_branch: gh-pages
          keep_files: true
