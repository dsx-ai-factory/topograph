name: Cleanup Untagged Container Images

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show the images that would be deleted'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      cut_off:
        description: 'Delete images older than this (for example, 1d, 7d, or 30d)'
        required: true
        default: '30d'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup-untagged-images:
    name: Cleanup Untagged Images
    if: github.repository == 'dsx-ai-factory/topograph'
    runs-on: linux-amd64-cpu32
    timeout-minutes: 30
    permissions:
      # snok/container-retention-policy deletes package versions through the
      # GitHub packages API, which the action documents as requiring
      # packages:write for an installation token such as GITHUB_TOKEN.
      contents: read
      packages: write

    steps:
      # What this keeps, checked against the v3.1.0 source
      # (src/core/filter_out_multi_arch_children.rs, src/registry/client.rs):
      #
      # - Platform manifests of a multi-arch image. They are untagged, but
      #   v3.1.0 fetches the manifest of every tagged version it keeps (with
      #   tag-selection: untagged, that is every tagged version) and removes
      #   the children of any image index from the deletion candidates. The
      #   SBOM and OpenVEX attestations docker.yml publishes point at these
      #   manifests, so they must survive.
      # - Signatures and attestations. GHCR has no OCI referrers API, so cosign
      #   and actions/attest store them through the referrers tag fallback: an
      #   image index tagged `sha256-<subject hex>` whose children are the
      #   untagged Sigstore bundle manifests. The `sha256-*` index is tagged, so
      #   it is never selected, and its bundle manifests are protected as its
      #   children by the same rule.
      #
      # The protection fails closed: if a manifest cannot be fetched, nothing is
      # deleted from the package. Keep v3.1.0 or later, and do not switch
      # tag-selection to `tagged` or `both` without excluding the `sha256-*`
      # tags through `image-tags`, or the signatures and attestations become
      # deletion candidates.
      - name: Delete stale untagged images
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: dsx-ai-factory
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: topograph
          cut-off: ${{ github.event.inputs.cut_off || '30d' }}
          keep-n-most-recent: 5
          dry-run: ${{ github.event.inputs.dry_run || 'false' }}
          tag-selection: untagged
          timestamp-to-use: updated_at
