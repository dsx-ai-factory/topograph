# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"

permissions:
  contents: read

jobs:
  check:
    runs-on: linux-amd64-cpu8
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.1'

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2
        args: -v --timeout 5m
        skip-cache: true

    - name: vet
      run:
        make vet

    - name: fmt
      run:
        test -z "$(go fmt ./...)"

  test:
    runs-on: linux-amd64-cpu8
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.1'

    - name: Test
      run: go test -v -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.out
        fail_ci_if_error: false
        verbose: true

  build:
    runs-on: linux-amd64-cpu8
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.1'

    - name: Build
      run: |
        make build

  govulncheck:
    runs-on: linux-amd64-cpu8
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.1'
        cache: true

    - name: Run govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
