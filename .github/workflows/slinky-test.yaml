# Slinky integration test: deploy a control-plane-only Slurm cluster and verify
# that Topograph publishes OCI-sim tree topology configuration.

name: Slinky Test

on:
  push:
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

env:
  SLINKY_VERSION: 1.2.0
  TOPOGRAPH_IMAGE: topograph:ci

jobs:
  integration:
    name: oci-sim / slinky
    runs-on: linux-amd64-cpu16
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.1

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: topograph
          wait: 120s

      - name: Build test image
        run: |
          docker build \
            --build-arg TARGETOS=linux \
            --build-arg TARGETARCH=amd64 \
            --tag "$TOPOGRAPH_IMAGE" \
            .
          kind load docker-image "$TOPOGRAPH_IMAGE" --name topograph

      - name: Deploy Slinky
        run: scripts/deploy-slinky.sh --compute-mode none

      - name: Deploy and verify Topograph
        run: tests/ci/run-slinky-test.sh

      - name: Collect diagnostics
        if: failure()
        run: tests/ci/collect-slinky-diagnostics.sh
