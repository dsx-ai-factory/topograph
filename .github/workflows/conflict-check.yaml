# Labels open, non-draft pull requests that target main and no longer merge
# cleanly into it, so authors and reviewers see a conflict without opening
# each PR:
#   mergeable false  add needs-rebase and comment once per conflict,
#                    mentioning the author
#   mergeable true   remove needs-rebase if the PR has it
#   mergeable null   read it again after 5 s and after 10 s more; still null
#                    after three reads, log it and change nothing
# Only PRs whose base is main are listed: one that targets another branch
# would be checked against that branch but told to update from main. Open PRs
# are read page by page, so the check covers more than the first 100.
#
# Why push to main: a PR starts conflicting when its base moves, and GitHub
# recomputes `mergeable` against the new main after each push to it. The check
# does not run when an author pushes a fix to the PR branch, so needs-rebase
# comes off on the next push to main, or earlier through workflow_dispatch.
#
# Why null is read again: pulls.get returns `mergeable: null` while GitHub is
# still computing it in the background, which is common right after main
# moves, and no other run would read that PR until main moves again. Reading
# null as a conflict would label PRs that merge cleanly, and reading it as
# clean would strip the label from PRs that still conflict. Every PR is read
# once before the first wait, and the waits are shared by all PRs still
# unknown, so a run waits at most 15 s however many PRs are pending.
#
# Why the comment carries a marker: the label alone does not prove the author
# was told. If createComment fails after addLabels succeeded, the PR keeps the
# label with no comment. So for a conflicting PR that already has the label,
# the run lists its issue events and comments, and posts the comment unless
# one carrying the hidden marker was created at or after needs-rebase last went
# on; a comment from an earlier conflict does not count. The label still goes
# on first, so a missing label fails the job before any comment is posted.
#
# Why no cancel: runs share one concurrency group and a running one is never
# cancelled, because a cancelled run would skip part of the check for the
# merge that started it. GitHub still replaces a pending run with a newer one,
# which loses nothing, since every run reads all open PRs as they stand when
# it starts.
#
# Permissions: listing and reading PRs needs pull-requests read. Labels,
# comments and issue events go through the issues endpoints, which accept
# pull-requests read or write on a pull request (GitHub's "Permissions
# required for GitHub Apps", Pull requests section), so the job does not hold
# issues: write. That token cannot create a label, so needs-rebase must exist
# (it is declared in .github/labels.yml); if it does not, addLabels fails and
# so does the job.

name: Merge Conflict Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Nothing at the workflow level; the job declares what it uses.
permissions: {}

jobs:
  conflicts:
    name: Label pull requests that conflict with main
    # Upstream only, so a fork with Actions enabled never labels or comments on
    # its own pull requests.
    if: github.repository == 'dsx-ai-factory/topograph'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write # read open PRs and their events and comments, add or remove needs-rebase, comment on them
    steps:
      - name: Check open pull requests for conflicts
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            // Hidden when GitHub renders the comment; a later run finds the
            // comment by it.
            const MARKER = '<!-- conflict-check: needs-rebase -->';
            // The wait before each read of a PR whose mergeable is still null.
            const WAITS_MS = [0, 5000, 10000];

            // Whether a marker comment was created at or after the label last
            // went on, so it was posted for the current conflict.
            async function notified(number) {
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner,
                repo,
                issue_number: number,
                per_page: 100,
              });
              const labeledAt = events
                .filter((event) => event.event === 'labeled' && event.label?.name === 'needs-rebase')
                .reduce((latest, event) => Math.max(latest, Date.parse(event.created_at)), -Infinity);
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: number,
                per_page: 100,
              });
              return comments.some(
                (comment) => (comment.body ?? '').includes(MARKER) && Date.parse(comment.created_at) >= labeledAt,
              );
            }

            async function reconcile(pr) {
              const number = pr.number;
              const labeled = pr.labels.some((label) => label.name === 'needs-rebase');
              if (pr.mergeable === false) {
                if (!labeled) {
                  // Not caught: a missing label must fail the job, and the
                  // comment must not go out without the label.
                  await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['needs-rebase'] });
                } else if (await notified(number)) {
                  core.info(`#${number}: conflicts with main, already labeled and told`);
                  return;
                }
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: number,
                  body: [
                    `@${pr.user.login} this pull request no longer merges cleanly into \`main\`.`,
                    'Please rebase it onto the latest `main`, or merge `main` into it, resolve the conflicts, and push.',
                    'The `needs-rebase` label comes off the next time this check finds that it merges cleanly;',
                    'the check runs after every push to `main`.',
                  ].join(' ') + `\n\n${MARKER}`,
                });
                core.info(`#${number}: conflicts with main, labeled needs-rebase and commented`);
              } else if (labeled) {
                // mergeable is true here.
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'needs-rebase' });
                core.info(`#${number}: merges cleanly, removed needs-rebase`);
              }
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            let pending = [];
            for (const listed of pulls) {
              if (listed.draft) {
                core.info(`#${listed.number}: draft, skipped`);
                continue;
              }
              pending.push(listed.number);
            }

            for (const wait of WAITS_MS) {
              if (pending.length === 0) break;
              if (wait > 0) await new Promise((resolve) => setTimeout(resolve, wait));
              const unknown = [];
              for (const number of pending) {
                // pulls.list does not return mergeable; pulls.get does, and
                // starts GitHub's background computation when it is unknown.
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
                if (pr.mergeable === null) unknown.push(number);
                else await reconcile(pr);
              }
              pending = unknown;
            }

            for (const number of pending) {
              core.info(`#${number}: mergeability still unknown after ${WAITS_MS.length} reads, left for the next run`);
            }
