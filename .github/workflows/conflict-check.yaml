# Labels open pull requests that no longer merge cleanly into main, so authors
# and reviewers see a conflict without opening each PR:
#   mergeable false  add needs-rebase and comment once, mentioning the author
#   mergeable true   remove needs-rebase if the PR has it
#   mergeable null   log it and change nothing
# Draft pull requests are skipped. Open PRs are read page by page, so the check
# covers more than the first 100.
#
# Why push to main: a PR starts conflicting when its base moves, and GitHub
# recomputes `mergeable` against the new main after each push to it. The check
# does not run when an author pushes a fix to the PR branch, so needs-rebase
# comes off on the next push to main, or earlier through workflow_dispatch.
#
# Why null is skipped: pulls.get returns `mergeable: null` while GitHub is
# still computing it in the background, which is common right after main
# moves. Reading null as a conflict would label PRs that merge cleanly, and
# reading it as clean would strip the label from PRs that still conflict. The
# next run sees the computed value.
#
# Why no cancel: runs share one concurrency group and a running one is never
# cancelled, because a cancelled run would skip part of the check for the
# merge that started it. Stopped between adding the label and posting the
# comment, it leaves a labeled PR whose author is never asked to rebase: the
# next run sees the label and does not comment again. GitHub still replaces a
# pending run with a newer one, which loses nothing, since every run reads all
# open PRs as they stand when it starts.
#
# Permissions: listing and reading PRs needs pull-requests read. Labels and
# comments go through the issues endpoints, which accept pull-requests write
# on a pull request (GitHub's "Permissions required for GitHub Apps", Pull
# requests section), so the job does not hold issues: write. That token cannot
# create a label, so needs-rebase must exist (it is declared in
# .github/labels.yml); if it does not, addLabels fails and so does the job.

name: Merge Conflict Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Nothing at the workflow level; the job declares what it uses.
permissions: {}

jobs:
  conflicts:
    name: Label pull requests that conflict with main
    # Upstream only, so a fork with Actions enabled never labels or comments on
    # its own pull requests.
    if: github.repository == 'dsx-ai-factory/topograph'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write # read open PRs, add or remove needs-rebase, comment on them
    steps:
      - name: Check open pull requests for conflicts
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            for (const listed of pulls) {
              const number = listed.number;
              if (listed.draft) {
                core.info(`#${number}: draft, skipped`);
                continue;
              }

              // pulls.list does not return mergeable; pulls.get does, and
              // starts GitHub's background computation when it is unknown.
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              const labeled = pr.labels.some((label) => label.name === 'needs-rebase');

              if (pr.mergeable === null) {
                core.info(`#${number}: GitHub has not computed mergeability yet, skipped`);
              } else if (pr.mergeable === false) {
                if (labeled) {
                  core.info(`#${number}: conflicts with main, already labeled`);
                  continue;
                }
                // Not caught: a missing label must fail the job, and the
                // comment must not go out without the label.
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['needs-rebase'] });
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: number,
                  body: [
                    `@${pr.user.login} this pull request no longer merges cleanly into \`main\`.`,
                    'Please rebase it onto the latest `main`, or merge `main` into it, resolve the conflicts, and push.',
                    'The `needs-rebase` label comes off the next time this check finds that it merges cleanly;',
                    'the check runs after every push to `main`.',
                  ].join(' '),
                });
                core.info(`#${number}: conflicts with main, labeled needs-rebase`);
              } else if (labeled) {
                // mergeable is true here.
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'needs-rebase' });
                core.info(`#${number}: merges cleanly, removed needs-rebase`);
              }
            }
