# Kubernetes integration tests: deploy Topograph to kind with KWOK nodes and
# verify the k8s engine against model-backed providers.

name: Kubernetes Test

on:
  push:
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

env:
  KWOK_RELEASE: v0.8.0
  TOPOGRAPH_IMAGE: topograph:ci

jobs:
  integration:
    name: k8s / ${{ matrix.provider }}
    runs-on: linux-amd64-cpu16
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: test
            values: tests/ci/values.k8s-test.yaml
            expected_tier_0: sw12
            expected_tier_1: sw21
            expected_tier_2: sw3
            expected_accelerator: nvl2
          - provider: aws-sim
            values: tests/ci/values.k8s-aws-sim.yaml
            expected_tier_0: sw12
            expected_tier_1: sw21
            expected_tier_2: sw3
            expected_accelerator: nvl2
          - provider: gcp-sim
            values: tests/ci/values.k8s-gcp-sim.yaml
            expected_tier_0: sw12
            expected_tier_1: sw21
            expected_tier_2: sw3
            expected_accelerator: sw12
          - provider: crusoe
            model: ./tests/models/crusoe-small.yaml
            values: tests/ci/values.k8s-crusoe.yaml
            test_node: gpu-05
            expected_tier_0: 7c3d9f68-5b21-4e84-a0f3-9e1b8d2c6a57
            expected_tier_1: 1d0e8b3a-2c47-4f16-9a55-7be3d9c4f082
            expected_tier_2: crusoe
            # The Crusoe provider discovers fabric tiers only, so there is no
            # accelerator domain to assert.
            expected_accelerator: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.1

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: topograph
          wait: 120s

      - name: Build test binaries and image
        run: |
          make build TARGETS=kwok-nodes
          docker build \
            --build-arg TARGETOS=linux \
            --build-arg TARGETARCH=amd64 \
            --tag "$TOPOGRAPH_IMAGE" \
            .
          kind load docker-image "$TOPOGRAPH_IMAGE" --name topograph

      - name: Create KWOK nodes
        env:
          KWOK_MODEL: ${{ matrix.model || './tests/models/medium.yaml' }}
        run: |
          ./scripts/create-kind-kwok-cluster.sh \
            --model "$KWOK_MODEL" \
            --cluster topograph \
            --kwok-release "$KWOK_RELEASE"

      - name: Deploy and verify Topograph
        env:
          VALUES_FILE: ${{ matrix.values }}
          EXPECTED_ACCELERATOR: ${{ matrix.expected_accelerator }}
          TEST_NODE: ${{ matrix.test_node || '1202' }}
          EXPECTED_TIER_0: ${{ matrix.expected_tier_0 }}
          EXPECTED_TIER_1: ${{ matrix.expected_tier_1 }}
          EXPECTED_TIER_2: ${{ matrix.expected_tier_2 }}
        run: tests/ci/run-k8s-test.sh "$VALUES_FILE" "$EXPECTED_ACCELERATOR"

      - name: Collect diagnostics
        if: failure()
        run: tests/ci/collect-k8s-diagnostics.sh
