name: Fern Docs CI

on:
  push:
    paths:
      - 'docs/**'
      - 'fern/**'
      - '.github/workflows/fern-docs-ci.yml'
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fern-check:
    name: Fern Check
    runs-on: linux-amd64-cpu8
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check markdown filename conventions
        run: |
          BAD=$(find docs/ -name '*.md' | grep -E '[A-Z_]' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Markdown filenames must be lowercase with hyphens only:"
            echo "$BAD"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install Fern CLI
        run: npm install -g "fern-api@$(jq -r .version fern/fern.config.json)"

      - name: Check MDX safety
        # Intentionally inline — a composite action would add indirection without benefit for a single grep.
        # Single-line grep is intentional — multiline <img> tags do not occur in practice in markdown docs.
        run: |
          BAD=$(grep -rn '<img\b[^>]*[^/]>\|<img>' docs/ fern/ --include="*.md" --include="*.mdx" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Non-self-closing <img> tags found (MDX requires <img ... />):"
            echo "$BAD"
            exit 1
          fi

      - name: Check that all docs pages are listed in index.yml
        # Every .md file under docs/ (excluding the design/ drafting space) must
        # appear in docs/index.yml so it is reachable from the Fern sidebar.
        run: |
          MISSING=0
          while IFS= read -r -d '' f; do
            rel="${f#docs/}"
            if ! sed -nE 's/^[[:space:]]*path:[[:space:]]*//p' docs/index.yml | grep -Fqx -- "$rel"; then
              echo "::error file=$f::$f is not listed in docs/index.yml (add it or move it to docs/design/ if it is a draft)"
              MISSING=1
            fi
          done < <(find docs/ -name '*.md' -not -path 'docs/design/*' -print0)
          [ "$MISSING" -eq 0 ]

      - name: Fern check
        run: fern check

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress 'docs/**/*.md'
          fail: true
