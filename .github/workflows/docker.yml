name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Nothing at workflow level; the build job asks for what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  # Platforms the image is built for. The attest and verify actions fail when
  # the pushed index contains anything else, so every released platform gets
  # its own SBOM.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: linux-amd64-cpu16
    permissions:
      # Check out the repository.
      contents: read
      # Push the image, and the signature and attestations that cosign and
      # actions/attest store beside it in GHCR.
      packages: write
      # Mint the GitHub OIDC token that keyless cosign and actions/attest
      # exchange with Sigstore Fulcio for a short-lived signing certificate.
      id-token: write
      # actions/attest records the SLSA provenance in the GitHub attestations
      # API, which is what `gh attestation verify` reads.
      attestations: write
      # actions/attest records an artifact metadata storage record for the
      # pushed image.
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate manual branch
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${BRANCH_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch ${BRANCH_NAME} conflicts with the official release tag namespace."
            echo "::error::Publish official releases by pushing the matching Git tag instead."
            exit 1
          fi

      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vX.Y.Z; got ${RELEASE_TAG}"
            exit 1
          fi

          version=${RELEASE_TAG#v}
          chart_version=$(awk '$1 == "version:" {gsub(/"/, "", $2); print $2; exit}' charts/topograph/Chart.yaml)
          app_version=$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2; exit}' charts/topograph/Chart.yaml)

          if [[ "${chart_version}" != "${version}" ]]; then
            echo "::error::Chart version ${chart_version} does not match release version ${version}."
            exit 1
          fi
          if [[ "${app_version}" != "${RELEASE_TAG}" ]]; then
            echo "::error::Chart appVersion ${app_version} does not match release tag ${RELEASE_TAG}."
            exit 1
          fi

      # Only official releases (a vX.Y.Z tag, pushed or re-dispatched as
      # RELEASE.md documents for retries) and release candidates (a manual
      # dispatch from a release-X.Y branch) are signed and get an SBOM and VEX.
      # Keep these patterns in step with the certificate identity regexp passed
      # to cosign-verify-image below, with its copy in the SECURITY.md
      # ClusterImagePolicy sample, and with the exact per-release identities
      # in the SECURITY.md and RELEASE.md verification commands.
      - name: Decide whether to publish release evidence
        id: evidence
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "${REF_TYPE}" == "tag" && "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            publish=true
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && "${REF_TYPE}" == "branch" \
                && "${REF_NAME}" =~ ^release-[0-9]+\.[0-9]+$ ]]; then
            publish=true
          fi
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "Sign and attest SBOM and VEX for ${REF_TYPE} ${REF_NAME}: ${publish}"

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: latest=false
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,priority=100,prefix=,suffix=,format=short

      # Set up QEMU for cross-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit provenance would add unsigned attestation manifests
          # (platform unknown/unknown) to the index, beside the signed
          # provenance actions/attest publishes below. The actions/attest
          # provenance is the one RELEASE.md and SECURITY.md verify.
          provenance: false

      - name: Generate SLSA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        if: steps.evidence.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned, not inherited from the installer: the cosign release decides
          # the on-registry bundle layout, and the attest action requires v3.1.0
          # or later.
          cosign-release: v3.1.3

      - name: Sign the image and attest SBOM and OpenVEX
        id: attest
        if: steps.evidence.outputs.publish == 'true'
        uses: ./.github/actions/cosign-attest-multiplatform
        with:
          image-name: ${{ steps.image.outputs.name }}
          index-digest: ${{ steps.build-and-push.outputs.digest }}
          platforms: ${{ env.PLATFORMS }}

      # The identity pins the signer to this workflow and to the two refs that
      # publish releases. SECURITY.md carries a copy in its ClusterImagePolicy
      # sample; SECURITY.md and RELEASE.md document the exact per-release
      # identities it accepts. Change them together.
      - name: Verify signature and attestations
        if: steps.evidence.outputs.publish == 'true'
        uses: ./.github/actions/cosign-verify-image
        with:
          image-name: ${{ steps.image.outputs.name }}
          index-digest: ${{ steps.build-and-push.outputs.digest }}
          platforms: ${{ env.PLATFORMS }}
          certificate-identity-regexp: '^https://github\.com/dsx-ai-factory/topograph/\.github/workflows/docker\.yml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+|heads/release-[0-9]+\.[0-9]+)$'
          verify-openvex: ${{ steps.attest.outputs.openvex-attested }}
