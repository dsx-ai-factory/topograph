# Follows up on idle issues and pull requests once a day. CONTRIBUTING.md
# "Following up" describes this for contributors.
#
#   questions      An issue labeled `question` with no activity for 90 days
#                  gets lifecycle/stale and a comment, and closes 30 days
#                  later. actions/stale does this; pull requests are off.
#   pull-requests  Reminds the person a quiet pull request is waiting on, and
#                  labels one idle for 30 days lifecycle/stale. It never closes
#                  a pull request. It posts at most 20 reminders a run, the
#                  longest idle first, and starts as a dry run
#                  (NUDGE_DRY_RUN) that only logs its reminders and label
#                  changes.
#   lock           Locks issues and pull requests that have been closed with no
#                  activity for 90 days, oldest first and at most 50 a run. It
#                  posts no comment; the lock shows as an event in the
#                  thread's timeline. Just before each lock it reads the
#                  thread again and skips it if it was updated since the
#                  list. It starts as a dry run (LOCK_DRY_RUN) that only
#                  logs what it would lock.
#
# Who a pull request is waiting on: a draft, or one where a reviewer has
# requested changes, waits on its author (reminded after 14 days). Any other
# open pull request waits on its requested reviewers and teams (reminded
# after 5 business days, Monday to Friday in UTC; holidays count as business
# days). With no reviewer or team requested, the run logs it and comments
# nowhere. A reviewer's state is their latest review that approves, requests
# changes or was dismissed, as on GitHub: a commented review, which a reply
# in a review thread is, leaves it as it was, and a dismissal clears a
# request. Unlike GitHub's review state, a request for changes also stops
# counting once the author asks that reviewer to review again.
#
# Idle time runs from the newest timeline event made by a person: comments,
# reviews, force pushes, label changes and so on. Events by bots do not count,
# and neither do `mentioned` or `subscribed`, which GitHub records against the
# mentioned user a second after any comment that @-mentions them, this job's
# reminders included. A push counts from when it reached the pull request:
# the timeline's `committed` events carry only each commit's own date and no
# account, so they do not count, and the pull_request workflow runs for the
# head commit (pr-title.yaml runs on every push) give the push time and, as
# their actor, who pushed. Only the head commit's runs are read, so when a bot
# pushes after a person, the person's push no longer counts. GitHub starts no
# pull_request run for a pull request with merge conflicts; with no run on
# the head commit, its push counts from the first check run on it (the dco
# app checks every pushed commit within seconds), as a person's push. A head
# commit with no run and no check run cannot be dated, so the pull request
# counts as active: no reminder and no lifecycle/stale. Each reminder
# ends with a hidden marker holding the start of the idle period; a reminder
# is not repeated while a comment by github-actions[bot] carries that marker,
# so each quiet period gets one.
# Pull requests labeled lifecycle/frozen or do-not-merge get no reminder and
# never get lifecycle/stale; one that already has it still loses it after
# new activity. lifecycle/frozen also exempts a question issue.
#
# Schedule: 06:15 UTC, clear of the Scorecard run at 06:00 and of
# workflow-lint.yaml on Mondays at 07:30.
#
# Permissions: each job holds only what it uses. Labels, comments and locks on
# a pull request go through the issues endpoints, which accept pull-requests
# write on a pull request (GitHub's "Permissions required for GitHub Apps"),
# so the pull-requests job does not hold issues: write. Neither token can
# create a label, so lifecycle/stale must exist (it is declared in
# .github/labels.yml); if it does not, adding it fails. A failure on one pull
# request is logged and the job goes on with the others, then fails the step
# with the numbers of the pull requests it could not process.
# actions/stale's README also suggests `actions: write`, which only lets it
# keep its place in a cache between runs that stop at operations-per-run.
# The questions job reads well under one 100-issue batch, so it starts from
# the first issue each run and does not need it.

name: Stale

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

# One run at a time, and a running one is never cancelled. A manual run that
# overlapped the scheduled one would see no reminder yet and post a second
# one, and both would try to lock the same threads.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Nothing at the workflow level; each job declares what it uses.
permissions: {}

jobs:
  questions:
    name: Mark and close idle questions
    # Upstream only, so a fork with Actions enabled never acts on its own
    # issues.
    if: github.repository == 'dsx-ai-factory/topograph'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write # read issues, label, comment on and close idle questions
    steps:
      - name: Mark and close idle question issues
        id: stale
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-issue-labels: question
          days-before-issue-stale: 90
          days-before-issue-close: 30
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: lifecycle/stale
          exempt-issue-labels: lifecycle/frozen
          stale-issue-message: >-
            This question has had no activity for 90 days, so it is now marked
            `lifecycle/stale`. If you still need an answer, comment here and
            the label comes off; otherwise this issue closes in 30 days. A
            maintainer can add `lifecycle/frozen` to keep it open.
          close-issue-message: >-
            Closing this question after 30 more days with no activity. If you
            still need an answer, comment here to ask a maintainer to reopen
            it, or open a new issue that links to this one.
          # Dry run (C5): the job logs what it would label, comment on and
          # close, and changes nothing. Flip to false in a follow-up commit
          # once a maintainer has read one week of these logs. The lock job
          # has the same switch, LOCK_DRY_RUN.
          debug-only: true
          operations-per-run: 100

  pull-requests:
    name: Remind idle pull requests
    # Upstream only, so a fork with Actions enabled never comments on or
    # labels its own pull requests.
    if: github.repository == 'dsx-ai-factory/topograph'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # list the pull_request workflow runs that date each push and name who pushed
      checks: read # list the check runs that date a push to a pull request with merge conflicts
      pull-requests: write # read PRs, timelines and reviews; comment; add or remove lifecycle/stale
    steps:
      - name: Remind authors and reviewers of idle pull requests
        id: nudge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const AUTHOR_DAYS = 14;
            const REVIEW_BUSINESS_DAYS = 5;
            const STALE_DAYS = 30;
            // Dry run (C5), like debug-only in the questions job and
            // LOCK_DRY_RUN: the job logs the reminders and label changes it
            // would make and changes nothing. Flip to false in a follow-up
            // commit once a maintainer has read one week of these logs.
            const NUDGE_DRY_RUN = true;
            // Reminders per run, the longest idle pull requests first. The
            // rest stay due and go out on the following daily runs. Label
            // changes are not capped.
            const NUDGE_LIMIT = 20;
            const EXEMPT = ['lifecycle/frozen', 'do-not-merge'];
            // GitHub records these against the mentioned user a second after
            // a comment that @-mentions them, so counting them would let every
            // reminder restart the idle period it reports.
            const PASSIVE_EVENTS = ['mentioned', 'subscribed'];
            const BOT_LOGIN = 'github-actions[bot]';
            const DAY_MS = 24 * 60 * 60 * 1000;
            const FOLLOWING_UP = 'https://github.com/dsx-ai-factory/topograph/blob/main/CONTRIBUTING.md#following-up';

            const { owner, repo } = context.repo;
            const now = new Date();

            // Timeline events and workflow runs carry created_at; reviews
            // carry submitted_at. A `committed` event carries neither, only
            // the commit's own dates, so it gets no time and never counts:
            // a commit can be weeks older than its push, and it names no
            // account, so a bot's commit would pass as a person's.
            function eventTime(event) {
              const stamp = event.created_at ?? event.submitted_at;
              return stamp ? new Date(stamp) : null;
            }

            // The newest timeline event or pull_request run made by a person,
            // and never earlier than the PR's opening: the timeline has no
            // event for it. A run's actor is the account that pushed.
            function lastActivity(pr, events, runs) {
              let newest = new Date(pr.created_at);
              for (const event of [...events, ...runs]) {
                if (PASSIVE_EVENTS.includes(event.event)) continue;
                if ((event.actor ?? event.user)?.type === 'Bot') continue;
                const at = eventTime(event);
                if (at && at > newest) newest = at;
              }
              return newest;
            }

            // Weekdays strictly after `start`, up to and including today, UTC.
            function businessDaysSince(start) {
              const day = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), start.getUTCDate()));
              let count = 0;
              for (;;) {
                day.setUTCDate(day.getUTCDate() + 1);
                if (day > now) return count;
                const weekday = day.getUTCDay();
                if (weekday !== 0 && weekday !== 6) count += 1;
              }
            }

            // A reviewer's state is their latest review that approves,
            // requests changes or was dismissed. A COMMENTED review (a reply
            // in a review thread is one) and a PENDING one leave it as it
            // was, and a dismissed review clears a request, which matches
            // GitHub's review:changes_requested search. Reviews come oldest
            // first, so the last such review per reviewer is their latest.
            // A request from a reviewer listed in `requested` does not count:
            // GitHub drops a reviewer from requested_reviewers when they
            // submit a review, so one listed there was asked to review again
            // and the pull request now waits on them.
            const REVIEW_DECISIONS = ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'];
            function changesRequested(reviews, requested) {
              const latest = new Map();
              for (const review of reviews) {
                if (REVIEW_DECISIONS.includes(review.state)) latest.set(review.user?.login, review.state);
              }
              return [...latest].some(([login, state]) => state === 'CHANGES_REQUESTED' && !requested.has(login));
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            // An error on one pull request is logged and that pull request
            // listed, so the others are still processed; the step fails at
            // the end. A missing lifecycle/stale label fails it this way.
            const failed = [];
            const decisions = [];
            for (const pr of pulls) {
              try {
                const number = pr.number;
                const labels = pr.labels.map((label) => label.name);
                const stale = labels.includes('lifecycle/stale');
                // An opted-out pull request gets no reminder and never gets
                // lifecycle/stale, but one that already has the label loses it
                // after new activity, like any other.
                const exempt = labels.find((name) => EXEMPT.includes(name));
                if (exempt && !stale) {
                  core.info(`#${number}: labeled ${exempt}, skipped`);
                  continue;
                }

                const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
                  owner,
                  repo,
                  issue_number: number,
                  per_page: 100,
                });
                const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                  owner,
                  repo,
                  event: 'pull_request',
                  head_sha: pr.head.sha,
                  per_page: 100,
                });
                // GitHub starts no pull_request run for a pull request with
                // merge conflicts. Apps such as dco still check each pushed
                // commit, within seconds of the push, so with no run the
                // first check run on the head commit dates its push; later
                // ones can be re-checks. It names no account, so it counts
                // as a person's push. With neither, nothing dates the push,
                // and the pull request counts as active rather than idle.
                let pushes = runs;
                let undated = false;
                if (runs.length === 0) {
                  const checks = await github.paginate(github.rest.checks.listForRef, {
                    owner,
                    repo,
                    ref: pr.head.sha,
                    filter: 'all',
                    per_page: 100,
                  });
                  const starts = checks.map((check) => Date.parse(check.started_at)).filter((ms) => !Number.isNaN(ms));
                  if (starts.length > 0) {
                    pushes = [{ created_at: new Date(Math.min(...starts)).toISOString() }];
                  } else {
                    undated = true;
                    core.info(`#${number}: no pull_request run or check run on the head commit, so its push cannot be dated; treated as active`);
                  }
                }
                const since = undated ? now : lastActivity(pr, events, pushes);
                const days = Math.floor((now - since) / DAY_MS);
                const businessDays = businessDaysSince(since);
                const onAuthor =
                  !exempt &&
                  (pr.draft ||
                    changesRequested(
                      await github.paginate(github.rest.pulls.listReviews, {
                        owner,
                        repo,
                        pull_number: number,
                        per_page: 100,
                      }),
                      new Set((pr.requested_reviewers ?? []).map((reviewer) => reviewer.login)),
                    ));

                let mentions = [];
                let text = '';
                if (exempt) {
                  core.info(`#${number}: labeled ${exempt}, no reminder`);
                } else if (onAuthor) {
                  if (days >= AUTHOR_DAYS) {
                    mentions = [pr.user.login];
                    text = pr.draft
                      ? `this draft pull request has had no activity for ${days} days. ` +
                        'Mark it ready for review when it is, or close it if you no longer plan to finish it.'
                      : `a reviewer requested changes on this pull request, and it has had no activity for ${days} days. ` +
                        'Push an update or reply to the review when you are ready.';
                  }
                } else if (businessDays >= REVIEW_BUSINESS_DAYS) {
                  // A team is mentioned as @org/slug.
                  mentions = [
                    ...(pr.requested_reviewers ?? []).map((reviewer) => reviewer.login),
                    ...(pr.requested_teams ?? []).map((team) => `${owner}/${team.slug}`),
                  ];
                  if (mentions.length === 0) {
                    core.info(`#${number}: waiting ${businessDays} business days for review, but no reviewer is requested; no comment`);
                  } else {
                    text =
                      `this pull request has waited ${businessDays} business days for a review. ` +
                      'Please review it, or reply here with when you expect to.';
                  }
                }

                // Read everything first and write afterwards, so the cap below
                // can pick the longest idle pull requests across the whole list.
                let reminder = null;
                if (text) {
                  const marker = `<!-- topograph-idle-nudge:${since.toISOString()} -->`;
                  // Match the author as well as the marker, so a comment anyone
                  // else writes cannot suppress a reminder.
                  const reminded = events.some(
                    (event) => event.event === 'commented' && event.user?.login === BOT_LOGIN && event.body?.includes(marker),
                  );
                  if (reminded) {
                    core.info(`#${number}: already reminded for the quiet period since ${since.toISOString()}`);
                  } else {
                    reminder = {
                      count: mentions.length,
                      body: [
                        `${mentions.map((login) => `@${login}`).join(' ')} ${text}`,
                        'These reminders and the `lifecycle/stale` label are explained under ' +
                          `[Following up](${FOLLOWING_UP}). Pull requests are never closed automatically.`,
                        marker,
                      ].join('\n\n'),
                    };
                  }
                }
                const label = days >= STALE_DAYS && !stale ? 'add' : days < STALE_DAYS && stale ? 'remove' : null;
                decisions.push({ number, since, days, reminder, label });
              } catch (error) {
                core.error(`#${pr.number}: ${error.message}`);
                failed.push(pr.number);
              }
            }

            // The longest idle first; sort is stable, so ties keep list order.
            const due = decisions.filter((decision) => decision.reminder).sort((a, b) => a.since - b.since);
            const chosen = new Set(due.slice(0, NUDGE_LIMIT).map((decision) => decision.number));
            for (const decision of due.slice(NUDGE_LIMIT)) {
              core.info(`#${decision.number}: reminder due, left for a later run (at most ${NUDGE_LIMIT} a run)`);
            }

            const dry = NUDGE_DRY_RUN ? ' (dry run)' : '';
            let posted = 0;
            for (const { number, since, days, reminder, label } of decisions) {
              try {
                if (chosen.has(number)) {
                  if (!NUDGE_DRY_RUN) await github.rest.issues.createComment({ owner, repo, issue_number: number, body: reminder.body });
                  core.info(
                    `#${number}: ${NUDGE_DRY_RUN ? 'would remind' : 'reminded'} ${reminder.count} account(s), ` +
                      `idle since ${since.toISOString()}${dry}`,
                  );
                  posted += 1;
                }
                if (label === 'add') {
                  // A missing label fails here and so fails the step.
                  if (!NUDGE_DRY_RUN) await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['lifecycle/stale'] });
                  core.info(`#${number}: idle ${days} days, ${NUDGE_DRY_RUN ? 'would add' : 'added'} lifecycle/stale${dry}`);
                } else if (label === 'remove') {
                  if (!NUDGE_DRY_RUN) await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'lifecycle/stale' });
                  core.info(`#${number}: active again, ${NUDGE_DRY_RUN ? 'would remove' : 'removed'} lifecycle/stale${dry}`);
                }
              } catch (error) {
                core.error(`#${number}: ${error.message}`);
                failed.push(number);
              }
            }
            core.info(
              `${NUDGE_DRY_RUN ? 'Dry run: would remind on' : 'Reminded on'} ${posted} of ${due.length} pull requests due a reminder; ` +
                `${due.length - chosen.size} left for later runs.`,
            );
            if (failed.length > 0) {
              const list = failed.sort((a, b) => a - b).map((number) => `#${number}`).join(', ');
              core.setFailed(`Could not process ${failed.length} pull requests: ${list}. See the errors above.`);
            }

  lock:
    name: Lock old closed threads
    # Upstream only, so a fork with Actions enabled never locks its own
    # threads.
    if: github.repository == 'dsx-ai-factory/topograph'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write # list closed issues and lock them
      pull-requests: write # lock closed pull requests
    steps:
      - name: Lock issues and pull requests closed for 90 days
        id: lock
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const LOCK_DAYS = 90;
            // Dry run (C5), like debug-only in the questions job: the job logs
            // what it would lock and changes nothing. Flip to false in a
            // follow-up commit once a maintainer has read one week of these
            // logs.
            const LOCK_DRY_RUN = true;
            // Locks per run. Even if each lock counts as a content-creating
            // request, 50 stays under GitHub's secondary rate limit of 80 a
            // minute. A backlog drains over the following daily runs, oldest
            // first.
            const LOCK_LIMIT = 50;
            const DAY_MS = 24 * 60 * 60 * 1000;

            const { owner, repo } = context.repo;
            const cutoff = Date.now() - LOCK_DAYS * DAY_MS;

            // Read every candidate before changing any. A lock can change an
            // item's updated_at and so its place in this
            // least-recently-updated-first list; locking page by page could
            // then shift unread items onto pages already read.
            const old = [];
            for (let page = 1; ; page += 1) {
              const { data } = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'closed',
                sort: 'updated',
                direction: 'asc',
                per_page: 100,
                page,
              });
              const recent = data.findIndex((item) => Date.parse(item.updated_at) > cutoff);
              old.push(...(recent === -1 ? data : data.slice(0, recent)));
              if (recent !== -1 || data.length < 100) break;
            }

            // Eligible: closed, idle for LOCK_DAYS, and not locked yet.
            const eligible = [];
            for (const item of old) {
              if (item.locked) core.info(`#${item.number}: already locked`);
              else eligible.push(item);
            }

            // No comment: the lock alone shows in the thread's timeline.
            const batch = eligible.slice(0, LOCK_LIMIT);
            let done = 0;
            for (const item of batch) {
              if (LOCK_DRY_RUN) {
                core.info(`#${item.number}: would lock (dry run)`);
                done += 1;
                continue;
              }
              // Read the thread again just before locking it: a comment, a
              // reopen or someone else's lock can land after the list was
              // read. Each of them moves updated_at, so one check covers all.
              const { data: current } = await github.rest.issues.get({ owner, repo, issue_number: item.number });
              if (Date.parse(current.updated_at) > cutoff) {
                core.info(`#${item.number}: updated since it was listed, not locked`);
                continue;
              }
              await github.rest.issues.lock({ owner, repo, issue_number: item.number, lock_reason: 'resolved' });
              core.info(`#${item.number}: locked`);
              done += 1;
            }
            core.info(
              `${LOCK_DRY_RUN ? 'Dry run: would lock' : 'Locked'} ${done} of ${eligible.length} eligible threads; ` +
                `${eligible.length - batch.length} left for later runs.`,
            );
