name: Release Helm Charts

on: workflow_dispatch

concurrency:
  group: helm-repository-publication
  cancel-in-progress: false

permissions: {}

env:
  HELM_REPOSITORY: nvcr.io/1070195845945670/topograph

jobs:
  release:
    runs-on: linux-amd64-cpu8
    environment: ngc-publish
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - name: Package Helm chart
        run: |
          mkdir -p packaged
          helm lint charts/topograph
          helm package charts/topograph --destination packaged

      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          version: 1.3.0

      - name: Generate SHA-256 checksum
        run: |
          set -euo pipefail
          cd packaged
          for chart in topograph-*.tgz; do
            sha256sum "${chart}" > "${chart}.sha256"
            sha256sum --check "${chart}.sha256"
          done

      - name: Generate SLSA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packaged/topograph-*.tgz

      - name: Log into NGC OCI registry
        env:
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-release-registry.json
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${NGC_API_KEY}" ]]; then
            echo "::error::The NGC_API_KEY secret is required to publish Helm charts."
            exit 1
          fi
          printf '%s' "${NGC_API_KEY}" | helm registry login "${HELM_REPOSITORY%%/*}" \
            --username '$oauthtoken' --password-stdin

      - name: Publish Helm chart and checksum to NGC OCI registry
        env:
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-release-registry.json
        run: |
          set -euo pipefail
          cd packaged
          for chart in topograph-*.tgz; do
            sha256sum --check "${chart}.sha256"
            if ! output=$(helm push "${chart}" "oci://${HELM_REPOSITORY}" 2>&1); then
              printf '%s\n' "${output}"
              exit 1
            fi
            printf '%s\n' "${output}"
            digest=$(awk '$1 == "Digest:" {print $2}' <<< "${output}")
            if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Helm did not return a valid chart manifest digest."
              exit 1
            fi
            oras attach --registry-config "${HELM_REGISTRY_CONFIG}" \
              --distribution-spec v1.1-referrers-api \
              --artifact-type application/vnd.topograph.checksum.v1 \
              "${HELM_REPOSITORY}/topograph@${digest}" "${chart}.sha256:text/plain"
          done

      - name: Remove registry credentials
        if: always()
        env:
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-release-registry.json
        run: rm -f "${HELM_REGISTRY_CONFIG}"
