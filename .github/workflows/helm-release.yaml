name: Release Helm Charts

on: workflow_dispatch

concurrency:
  group: helm-repository-publication
  cancel-in-progress: false

permissions: {}

env:
  HELM_REPOSITORY: https://helm.ngc.nvidia.com/1070195845945670/topograph

jobs:
  release:
    runs-on: linux-amd64-cpu8
    environment: ngc-publish
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - name: Package Helm chart
        run: |
          mkdir -p packaged
          helm lint charts/topograph
          helm package charts/topograph --destination packaged

      - name: Install Helm push plugin
        run: helm plugin install https://github.com/chartmuseum/helm-push --version v0.10.4

      - name: Generate SHA-256 checksum
        run: |
          set -euo pipefail
          cd packaged
          for chart in topograph-*.tgz; do
            sha256sum "${chart}" > "${chart}.sha256"
            sha256sum --check "${chart}.sha256"
          done

      - name: Generate SLSA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packaged/topograph-*.tgz

      - name: Publish Helm chart to NGC
        env:
          HELM_REPO_USERNAME: $oauthtoken
          HELM_REPO_PASSWORD: ${{ secrets.NGC_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${HELM_REPO_PASSWORD}" ]]; then
            echo "::error::The NGC_API_KEY secret is required to publish Helm charts."
            exit 1
          fi
          for chart in packaged/topograph-*.tgz; do
            helm cm-push "${chart}" "${HELM_REPOSITORY}"
          done
