name: Release Helm Charts

on: workflow_dispatch

concurrency:
  group: helm-repository-publication
  cancel-in-progress: false

permissions: {}

env:
  NGC_CLI_ORG: "1070195845945670"
  NGC_CLI_TEAM: topograph

jobs:
  release:
    runs-on: linux-amd64-cpu8
    environment: ngc-publish
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - name: Package Helm chart
        id: chart
        run: |
          set -euo pipefail
          mkdir -p packaged
          helm lint charts/topograph
          helm package charts/topograph --destination packaged
          version=$(helm show chart charts/topograph | awk '$1 == "version:" {print $2}')
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up NGC CLI
        # Keep the version and linux/amd64 archive checksum in sync. These pins
        # are maintained manually, like the workflow linters.
        env:
          NGC_CLI_VERSION: '4.36.6'
          NGC_CLI_SHA256: '2972dbe54e80cedae18e82923a9a67a60aef23d041c5790336f8f4b51752bab6'
        run: |
          set -euo pipefail
          ngc_dir=$(mktemp -d "${RUNNER_TEMP}/ngc-cli.XXXXXX")
          ngc_home=$(mktemp -d "${RUNNER_TEMP}/topograph-ngc.XXXXXX")
          printf 'NGC_CLI_HOME=%s\n' "${ngc_home}" >> "${GITHUB_ENV}"
          archive="${ngc_dir}/ngccli_linux.zip"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o "${archive}" \
            "https://api.ngc.nvidia.com/v2/resources/nvidia/ngc-apps/ngc_cli/versions/${NGC_CLI_VERSION}/files/ngccli_linux.zip"
          printf '%s  %s\n' "${NGC_CLI_SHA256}" "${archive}" | sha256sum --check -
          unzip -q "${archive}" -d "${ngc_dir}"
          chmod +x "${ngc_dir}/ngc-cli/ngc"
          printf '%s\n' "${ngc_dir}/ngc-cli" >> "${GITHUB_PATH}"
          NGC_CLI_HOME="${ngc_home}" "${ngc_dir}/ngc-cli/ngc" --version

      - name: Generate SHA-256 checksum
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail
          cd packaged
          chart="topograph-${CHART_VERSION}.tgz"
          sha256sum "${chart}" > "${chart}.sha256"
          sha256sum --check "${chart}.sha256"

      - name: Generate SLSA provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packaged/topograph-${{ steps.chart.outputs.version }}.tgz

      - name: Save attestation bundle
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${ATTESTATION_BUNDLE}" "packaged/topograph-${CHART_VERSION}.tgz.sigstore.json"

      - name: Retain chart, checksum, and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: topograph-chart-${{ steps.chart.outputs.version }}
          path: |
            packaged/topograph-${{ steps.chart.outputs.version }}.tgz
            packaged/topograph-${{ steps.chart.outputs.version }}.tgz.sha256
            packaged/topograph-${{ steps.chart.outputs.version }}.tgz.sigstore.json
          if-no-files-found: error

      - name: Publish Helm chart to NGC
        env:
          NGC_CLI_API_KEY: ${{ secrets.NGC_API_KEY }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${NGC_CLI_API_KEY}" ]]; then
            echo "::error::The NGC_API_KEY secret is required to publish Helm charts."
            exit 1
          fi
          cd packaged
          chart="topograph-${CHART_VERSION}.tgz"
          sha256sum --check "${chart}.sha256"
          target="${NGC_CLI_ORG}/${NGC_CLI_TEAM}/topograph"
          # NGC requires a chart metadata record before its first version.
          # If lookup fails, creation must succeed before attempting upload.
          if ! ngc registry chart info "${target}"; then
            ngc registry chart create "${target}" \
              --short-desc "Discovers the physical network topology of a cluster and exposes it to schedulers."
          fi
          ngc registry chart push "${target}:${CHART_VERSION}"

      - name: Remove NGC CLI state
        if: always()
        run: |
          if [[ -n "${NGC_CLI_HOME:-}" ]]; then
            rm -rf "${NGC_CLI_HOME}"
          fi
