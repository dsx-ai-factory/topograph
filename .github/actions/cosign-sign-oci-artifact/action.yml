# Signs one OCI artifact, addressed by digest, with a keyless Sigstore
# signature and then verifies that signature against the expected workflow
# identity. It is generic over the artifact type: the release workflows use it
# for the Helm chart pushed to GHCR.
#
# The caller must:
#   - grant the job `id-token: write`, so cosign can request a Fulcio
#     certificate for the workflow's OIDC identity, and `packages: write`, so it
#     can push the signature next to the artifact;
#   - be logged in to the registry through the Docker config (for example with
#     docker/login-action), which is where cosign reads credentials from.
#
# cosign stays on PATH for the rest of the job, so a later step can run
# `cosign verify-attestation` without installing it again.

name: Cosign sign OCI artifact
description: Keylessly sign one OCI artifact by digest with cosign and verify the signature against the expected identity.

inputs:
  subject-name:
    description: OCI repository without tag or digest, for example ghcr.io/owner/repo/charts/name.
    required: true
  subject-digest:
    description: Manifest digest of the artifact in sha256:<64 hex> form.
    required: true
  certificate-identity-regexp:
    description: >-
      Regular expression the Fulcio certificate identity (the signing
      workflow's URL and ref) must match for verification to pass.
    required: true
  certificate-oidc-issuer:
    description: Expected OIDC issuer of the Fulcio certificate.
    required: false
    default: "https://token.actions.githubusercontent.com"

runs:
  using: composite
  steps:
    # Validate before installing or signing anything, so a malformed subject
    # fails without touching the registry or the transparency log.
    - name: Validate inputs
      shell: bash
      env:
        SUBJECT_NAME: ${{ inputs.subject-name }}
        SUBJECT_DIGEST: ${{ inputs.subject-digest }}
        CERTIFICATE_IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
        CERTIFICATE_OIDC_ISSUER: ${{ inputs.certificate-oidc-issuer }}
      run: |
        set -euo pipefail
        # A ':' after the last '/' is a tag; a ':' before it is a registry port.
        if [[ -z "${SUBJECT_NAME}" || "${SUBJECT_NAME}" == *@* || "${SUBJECT_NAME##*/}" == *:* ]]; then
          echo "::error::subject-name must be an OCI repository without a tag or digest; got '${SUBJECT_NAME}'"
          exit 1
        fi
        if [[ ! "${SUBJECT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::subject-digest must be in sha256:<64 hex> form; got '${SUBJECT_DIGEST}'"
          exit 1
        fi
        if [[ -z "${CERTIFICATE_IDENTITY_REGEXP}" || -z "${CERTIFICATE_OIDC_ISSUER}" ]]; then
          echo "::error::certificate-identity-regexp and certificate-oidc-issuer must not be empty"
          exit 1
        fi

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        # Pinned rather than left to the installer's default, so a bump of the
        # installer cannot silently change the cosign major and with it the
        # signature layout that the verify step below and users rely on. Keep
        # this equal to the cosign pin in the other cosign actions under
        # .github/actions/.
        cosign-release: "v3.1.3"

    # --new-bundle-format is passed explicitly on sign and verify because its
    # default has changed between cosign releases; a flip on only one side would
    # look like a missing signature rather than a format mismatch.
    # Each call is bounded by timeout. cosign reaches the registry, Fulcio,
    # Rekor, and the Sigstore TUF root; a hung call should fail the release job
    # promptly rather than hold it open until the workflow times out.
    - name: Sign artifact
      shell: bash
      env:
        SUBJECT: ${{ inputs.subject-name }}@${{ inputs.subject-digest }}
      run: |
        set -euo pipefail
        timeout --foreground 120s cosign sign --yes --new-bundle-format=true "${SUBJECT}"

    - name: Verify signature
      shell: bash
      env:
        SUBJECT: ${{ inputs.subject-name }}@${{ inputs.subject-digest }}
        CERTIFICATE_IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
        CERTIFICATE_OIDC_ISSUER: ${{ inputs.certificate-oidc-issuer }}
      run: |
        set -euo pipefail
        timeout --foreground 120s cosign verify \
          --certificate-identity-regexp "${CERTIFICATE_IDENTITY_REGEXP}" \
          --certificate-oidc-issuer "${CERTIFICATE_OIDC_ISSUER}" \
          --new-bundle-format=true \
          "${SUBJECT}" > /dev/null
        echo "Verified the cosign signature on ${SUBJECT}"
