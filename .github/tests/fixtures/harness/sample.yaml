# Fixture for .github/tests/harness.test.mjs. GitHub never runs it, because it
# lives outside .github/workflows/.

name: Harness Sample

on:
  workflow_dispatch:

permissions: {}

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - id: greet
        name: Greet
        env:
          GREETING: hello
        run: |
          echo "$GREETING from the fixture"

      - id: scripted
        name: Scripted
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITLE: fixture title
        with:
          script: |
            core.info(process.env.TITLE);
