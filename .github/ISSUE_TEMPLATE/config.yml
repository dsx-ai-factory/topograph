# GitHub info on config.yml
# https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository#configuring-the-template-chooser
# Blank issues are off, so every issue starts from a form and gets its labels.
blank_issues_enabled: false

# Links shown in the chooser beside the forms. .github/tests/issue-templates.test.mjs
# pins their names, URLs and order.
contact_links:
  - name: Report a security vulnerability
    url: https://www.nvidia.com/object/submit-security-vulnerability.html
    about: Report it privately to NVIDIA PSIRT (this form or psirt@nvidia.com), as SECURITY.md describes. It is not a GitHub issue.
  - name: Ask a question
    url: https://github.com/dsx-ai-factory/topograph/blob/main/docs/community.md
    about: Ask in the community Slack channels. Use the Question form for a question that needs an answer on record.
  - name: Read the documentation
    url: https://docs.nvidia.com/topograph
    about: Guides for each provider and engine, the API, and the node label reference.
