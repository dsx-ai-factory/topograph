# This is the only form that applies `question`. Idle `question` issues are
# the only issues automation may close, so no other form may apply it.
name: Question
description: Ask a question about using or deploying Topograph
title: "[QST]: "
labels: ["question", "needs-triage"]

body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you want to know? If it matters, include the Topograph version, provider, engine, and deployment method.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Docs you read, commands you ran, and what happened. Redact any credentials or secrets.
    validations:
      required: false
