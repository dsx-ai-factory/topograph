name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG]: "
labels: ["bug"]

body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and found no duplicates
          required: true
        - label: I can reproduce this issue consistently
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: If it's a specific provider or engine, name it in the Bug Description above.
      options:
        - API Server
        - Node Observer
        - Node Data Broker
        - Provider
        - Engine
        - Helm chart
        - Other / Unknown
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Step one
        2. Step two
        3. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Topograph version:
        - Deployment method (binary/deb/rpm/container/Helm):
        - Scheduler (Slurm/Kubernetes/Slinky):
        - Cluster environment (bare-metal/CSP, specify provider):
      value: |
        - Topograph version:
        - Deployment method (binary/deb/rpm/container/Helm):
        - Scheduler (Slurm/Kubernetes/Slinky):
        - Cluster environment (bare-metal/CSP, specify provider):
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Paste the relevant `topograph-config.yaml` or Helm `values.yaml` (redact any credentials or secrets).
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Include relevant logs or error messages. Redact any credentials or secrets.
      render: shell

  - type: textarea
    id: misc
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/dsx-ai-factory/topograph/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow Topograph's Code of Conduct
          required: true
