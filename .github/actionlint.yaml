# actionlint configuration, read by .github/workflows/workflow-lint.yaml and by
# a local `actionlint` run from the repository root.

self-hosted-runner:
  # Self-hosted runner labels used by this repository's workflows. actionlint
  # only knows GitHub-hosted labels and reports anything else as unknown, so
  # add a label here when a workflow starts using it.
  labels:
    - linux-amd64-cpu8
    - linux-amd64-cpu16
    - linux-amd64-cpu32
    # GitHub-hosted Ubuntu 26.04 labels, used by vuln-scan-images.yaml.
    # actionlint 1.7.12 does not know them yet; drop these two once the
    # pinned actionlint accepts them.
    - ubuntu-26.04
    - ubuntu-26.04-arm

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # `concurrency.queue` (single or max) is a documented key in GitHub's
      # workflow syntax reference, but actionlint 1.7.12 does not know it yet.
      # Drop this ignore once the pinned actionlint accepts the key.
      - 'unexpected key "queue" for "concurrency"'
