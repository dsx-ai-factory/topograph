#               ______ sw3 _____
#              /                \
#          sw21                  sw22
#         /    \               /     \
#     sw11      sw12       sw13       sw14
#      |         |          |          |
#      |         |          |          |
#  -------    -------    -------    -------
# |  1101 |  |  1201 |  |  1301 |  |  1401 |
# |  1102 |  |  1202 |  |  1302 |  |  1402 |
#  -------    -------    -------    -------
#   nvl1       nvl2       nvl3       nvl4
#
# Labels:
# sw3: topology.kubernetes.io/region:us-west
# sw21: topology.kubernetes.io/zone:zone1
# sw22: topology.kubernetes.io/zone:zone2
#

switches:
  sw3:
    labels:
      topology.kubernetes.io/region: us-west
    switches:
    - sw21
    - sw22
  sw21:
    labels:
      topology.kubernetes.io/zone: zone1
    switches:
    - sw11
    - sw12
  sw22:
    labels:
      topology.kubernetes.io/zone: zone2
    switches:
    - sw13
    - sw14
blocks:
- switch: sw11
  nodes:
  - "[1101-1102]"
  annotations:
    accelerator.topology.test/domain: nvl1
- switch: sw12
  nodes:
  - "[1201-1202]"
  annotations:
    accelerator.topology.test/domain: nvl2
- switch: sw13
  nodes:
  - "[1301-1302]"
  annotations:
    accelerator.topology.test/domain: nvl3
- switch: sw14
  nodes:
  - "[1401-1402]"
  annotations:
    accelerator.topology.test/domain: nvl4
