# Publishes a NodeGPUNICMapping per Node: the GPUs closest to each NIC,
# for the SR-IOV DRA driver. The plugin is independent of the provider and
# engine below, which only decide how fabric topology is discovered and
# expressed. See docs/reference/gpu-nic-mapping.md.
#
# Prerequisites on every GPU Node:
#   - lldpd runs on the host; only NICs with neighbors are published,
#     with switch names included when advertised.
#   - NICs need no interface naming convention or regex configuration.
#   - The NVIDIA driver is loaded (it provides /proc/driver/nvidia).
#   - The release namespace admits the vpd-reader init container, which runs as
#     root to read PCI VPD (Pod Security "baseline", not "restricted").

provider:
  name: k8s-node-labels
  params:
    topologyLabels: [example.com/leaf, example.com/spine]
engine:
  name: k8s

nodeMetadata:
  plugins:
    gpuNicMapping:
      enabled: true
      refreshInterval: 10m
      switchSource:
        name: host-lldp
        hostLLDP:
          socket: /var/run/lldpd.socket

nodeDataBroker:
  enabled: true
  # Publish only on GPU Nodes.
  nodeSelector:
    nvidia.com/gpu.present: "true"
  # The broker reads the host lldpd socket as a non-root user. Add the group
  # that owns /var/run/lldpd.socket on the host (check with `ls -ln`); 0 is
  # only a placeholder for a root-group socket.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    supplementalGroups: [0]
    seccompProfile:
      type: RuntimeDefault
