suite: topograph networkpolicy
templates:
  - templates/networkpolicy.yaml
release:
  name: chart-ci
  namespace: topograph
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a NetworkPolicy covering the whole release when enabled
    set:
      networkPolicy:
        enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/instance"]
          value: chart-ci
      - contains:
          path: spec.policyTypes
          content: Ingress
      - notContains:
          path: spec.policyTypes
          content: Egress
      # Intra-release ingress so the node-observer can reach the API server.
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/instance"]
          value: chart-ci

  - it: adds a metrics scraper ingress rule when metricsScraperNamespace is set
    set:
      networkPolicy:
        enabled: true
        metricsScraperNamespace: prometheus-system
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 2
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: prometheus-system
      - equal:
          path: spec.ingress[1].ports[0].port
          value: 49021

  - it: does not add a metrics ingress rule when metricsScraperNamespace is empty
    set:
      networkPolicy:
        enabled: true
      serviceMonitor:
        enabled: true
        namespace: monitoring
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1

  - it: adds Egress with DNS and intra-release allows when extraEgress is set
    set:
      networkPolicy:
        enabled: true
        extraEgress:
          - to:
              - ipBlock:
                  cidr: 10.1.2.0/24
            ports:
              - protocol: TCP
                port: 8081
    asserts:
      - contains:
          path: spec.policyTypes
          content: Egress
      # egress[0] = DNS (scoped to kube-dns pods in kube-system),
      # egress[1] = intra-release, egress[2] = operator-supplied
      - equal:
          path: spec.egress[0].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: kube-system
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["k8s-app"]
          value: kube-dns
      - equal:
          path: spec.egress[0].ports[0].port
          value: 53
      - equal:
          path: spec.egress[1].to[0].podSelector.matchLabels["app.kubernetes.io/instance"]
          value: chart-ci
      - equal:
          path: spec.egress[2].to[0].ipBlock.cidr
          value: 10.1.2.0/24

  - it: scopes the DNS egress rule to a custom dnsPodSelector
    set:
      networkPolicy:
        enabled: true
        dnsPodSelector:
          app.kubernetes.io/name: coredns
        extraEgress:
          - to:
              - ipBlock:
                  cidr: 10.1.2.0/24
    asserts:
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["app.kubernetes.io/name"]
          value: coredns
      - notExists:
          path: spec.egress[0].to[0].podSelector.matchLabels["k8s-app"]

  - it: falls back to kube-dns selector when dnsPodSelector is empty
    set:
      networkPolicy:
        enabled: true
        dnsPodSelector: {}
        extraEgress:
          - to:
              - ipBlock:
                  cidr: 10.1.2.0/24
    asserts:
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["k8s-app"]
          value: kube-dns

  - it: appends extraIngress rules after the intra-release allow
    set:
      networkPolicy:
        enabled: true
        extraIngress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: ingress-nginx
            ports:
              - protocol: TCP
                port: 49021
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 2
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ingress-nginx

  # An empty rule object matches all traffic in its direction, and an empty
  # from, to, or ports list matches every peer or every port for that rule,
  # so the values schema rejects both.
  - it: rejects an empty extraIngress rule
    set:
      networkPolicy:
        enabled: true
        extraIngress:
          - {}
    asserts:
      - failedTemplate:
          errorPattern: "at '/networkPolicy/extraIngress/0': minProperties: got 0, want 1"

  - it: rejects an empty extraEgress rule
    set:
      networkPolicy:
        enabled: true
        extraEgress:
          - {}
    asserts:
      - failedTemplate:
          errorPattern: "at '/networkPolicy/extraEgress/0': minProperties: got 0, want 1"

  - it: rejects an extraIngress rule with an empty from list
    set:
      networkPolicy:
        enabled: true
        extraIngress:
          - from: []
            ports:
              - protocol: TCP
                port: 49021
    asserts:
      - failedTemplate:
          errorPattern: "at '/networkPolicy/extraIngress/0/from': minItems: got 0, want 1"

  - it: rejects an extraIngress rule with an empty ports list
    set:
      networkPolicy:
        enabled: true
        extraIngress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: ingress-nginx
            ports: []
    asserts:
      - failedTemplate:
          errorPattern: "at '/networkPolicy/extraIngress/0/ports': minItems: got 0, want 1"

  - it: rejects an extraEgress rule with an empty to list
    set:
      networkPolicy:
        enabled: true
        extraEgress:
          - to: []
            ports:
              - protocol: TCP
                port: 8081
    asserts:
      - failedTemplate:
          errorPattern: "at '/networkPolicy/extraEgress/0/to': minItems: got 0, want 1"

  - it: rejects an extraEgress rule with an empty ports list
    set:
      networkPolicy:
        enabled: true
        extraEgress:
          - to:
              - ipBlock:
                  cidr: 10.1.2.0/24
            ports: []
    asserts:
      - failedTemplate:
          errorPattern: "at '/networkPolicy/extraEgress/0/ports': minItems: got 0, want 1"
