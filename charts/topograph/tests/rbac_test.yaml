suite: rbac
templates:
  - templates/rbac.yaml
release:
  name: chart-ci
  namespace: topograph
tests:
  - it: renders a ClusterRole and ClusterRoleBinding by default
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 1
      - equal:
          path: roleRef.apiGroup
          value: rbac.authorization.k8s.io
        documentIndex: 1

  - it: still renders for an existing service account
    set:
      serviceAccount:
        create: false
        name: existing-topograph-sa
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: chart-ci-topograph
        documentIndex: 0
      - equal:
          path: metadata.name
          value: chart-ci-topograph
        documentIndex: 1
      - equal:
          path: roleRef.name
          value: chart-ci-topograph
        documentIndex: 1
      - equal:
          path: subjects[0].name
          value: existing-topograph-sa
        documentIndex: 1

  - it: rejects a missing existing service account name
    set:
      serviceAccount:
        create: false
        name: ""
    asserts:
      - failedTemplate:
          errorMessage: "serviceAccount.name must be set when serviceAccount.create=false"

  - it: is omitted entirely when rbac.create is false
    set:
      rbac:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: grants core node read and patch access by default
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [get, list, patch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [update]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [daemonsets]
            verbs: [get]

  - it: does not grant provider- or engine-specific access by default
    documentIndex: 0
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/exec]
            verbs: [create]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [configmaps]
            verbs: [create, get, update]
      - notContains:
          path: rules
          content:
            apiGroups: [nfd.k8s-sigs.io]
            resources: [nodefeatures, nodefeaturegroups]
            verbs: [create, list, patch, delete]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods]
            verbs: [get, list]
      - notContains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [daemonsets]
            verbs: [get, list]

  - it: grants node read access for the dra provider
    set:
      provider:
        name: dra
      engine:
        name: slurm
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list, patch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [get, list, patch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [update]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [daemonsets]
            verbs: [get]

  - it: grants pods, daemonsets, and pods/exec for the infiniband-k8s provider
    set:
      provider:
        name: infiniband-k8s
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/exec]
            verbs: [create]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods]
            verbs: [list]
      - contains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [daemonsets]
            verbs: [get]

  - it: grants configmaps, pods, and node list for the slinky engine
    set:
      engine:
        name: slinky
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [configmaps]
            verbs: [create, get, update]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [configmaps]
            verbs: [create, get, list, update]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list, patch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [get, list, patch]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: [apps]
            resources: [daemonsets]
            verbs: [get]

  - it: grants node patch access to the k8s engine
    set:
      engine:
        name: k8s
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [get, list, patch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [update]

  - it: does not grant node patch access to the slurm engine
    set:
      provider:
        name: dra
      engine:
        name: slurm
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list, patch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [get, list, patch]

  - it: does not grant node patch or update access to the non-dynamic slinky engine
    set:
      engine:
        name: slinky
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list, patch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [get, list, patch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [update]

  - it: grants node patch access to the dynamic slinky engine
    set:
      engine:
        name: slinky
        params:
          useDynamicNodes: true
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list, patch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [get, list, patch]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [update]

  - it: omits the ClusterRole and ClusterRoleBinding for a non-Kubernetes combo
    set:
      provider:
        name: test
      engine:
        name: slurm
    asserts:
      - hasDocuments:
          count: 0

  - it: still renders the ClusterRole for the slurm engine with a Kubernetes provider
    set:
      provider:
        name: infiniband-k8s
      engine:
        name: slurm
    asserts:
      - hasDocuments:
          count: 2
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list, patch]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [get, list, patch]
        documentIndex: 0

  - it: does not render NFD namespace RBAC for an explicit non-NFD engine
    set:
      engine:
        name: slinky
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 1

  - it: grants NFD CR access for the nfd engine
    set:
      engine:
        name: nfd
    asserts:
      - hasDocuments:
          count: 4
      - notContains:
          path: rules
          content:
            apiGroups: [nfd.k8s-sigs.io]
            resources: [nodefeatures, nodefeaturegroups]
            verbs: [create, list, patch, delete]
        documentIndex: 0
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list, patch]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [get, list, patch]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods]
            verbs: [list]
        documentIndex: 0
      - isKind:
          of: Role
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: node-feature-discovery
        documentIndex: 2
      - contains:
          path: rules
          content:
            apiGroups: [nfd.k8s-sigs.io]
            resources: [nodefeatures, nodefeaturegroups]
            verbs: [create, list, patch, delete]
        documentIndex: 2
      - isKind:
          of: RoleBinding
        documentIndex: 3
      - equal:
          path: metadata.namespace
          value: node-feature-discovery
        documentIndex: 3
      - equal:
          path: roleRef.kind
          value: Role
        documentIndex: 3
      - equal:
          path: roleRef.apiGroup
          value: rbac.authorization.k8s.io
        documentIndex: 3
      - equal:
          path: subjects[0].namespace
          value: topograph
        documentIndex: 3

  - it: scopes NFD CR access to the configured namespace
    set:
      engine:
        name: nfd
      nfdNamespace: custom-nfd
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-nfd
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: custom-nfd
        documentIndex: 3

  - it: does not grant pods/exec for slinky with a default flat cluster topology
    set:
      engine:
        name: slinky
        params:
          topologies:
            - clusterDefault: true
              plugin: topology/flat
    documentIndex: 0
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/exec]
            verbs: [create]

  - it: grants pods/exec for slinky partition discovery topologies
    set:
      engine:
        name: slinky
        params:
          topologies:
            - partition: gpu
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/exec]
            verbs: [create]

  - it: does not grant pods/exec for slinky when dynamic nodes are enabled
    set:
      engine:
        name: slinky
        params:
          useDynamicNodes: true
          topologies:
            - partition: gpu
    documentIndex: 0
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/exec]
            verbs: [create]

  - it: binds the ClusterRole to the service account in the release namespace
    documentIndex: 1
    asserts:
      - equal:
          path: roleRef.name
          value: chart-ci-topograph
      - equal:
          path: subjects[0].name
          value: chart-ci-topograph
      - equal:
          path: subjects[0].namespace
          value: topograph

  - it: grants node list for the crusoe provider with the slurm engine
    set:
      provider:
        name: crusoe
      engine:
        name: slurm
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list]
        documentIndex: 0
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/exec]
            verbs: [create]
        documentIndex: 0

  - it: grants node listing for the kubernetes provider with graph output
    set:
      provider.name: kubernetes
      engine.name: graph
    documentIndex: 0
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [nodes]
              verbs: [list]
