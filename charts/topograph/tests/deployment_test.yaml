suite: topograph deployment
# configmap.yml is rendered alongside deployment.yaml because the Deployment
# references it for its checksum/config pod annotation. Assertions are scoped
# to the Deployment via the per-assert `template` selector.
templates:
  - templates/deployment.yaml
  - templates/configmap.yml
release:
  name: chart-ci
  namespace: topograph
tests:
  - it: renders a Deployment with a single replica by default
    asserts:
      - isKind:
          of: Deployment
        template: templates/deployment.yaml
      - equal:
          path: spec.replicas
          value: 1
        template: templates/deployment.yaml

  - it: labels the API server pod for node-observer monitoring
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: api-server
        template: templates/deployment.yaml

  - it: hardens the pod and container security context by default
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
        template: templates/deployment.yaml

  - it: a per-key securityContext override wins over the hardened default
    set:
      securityContext:
        readOnlyRootFilesystem: false
    asserts:
      # the overridden key flips ...
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
        template: templates/deployment.yaml
      # ... while the other hardened keys are preserved
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
        template: templates/deployment.yaml

  - it: image tag falls back to the chart appVersion when empty
    chart:
      appVersion: v1.2.3
    set:
      image:
        tag: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/dsx-ai-factory/topograph:v1.2.3
        template: templates/deployment.yaml

  - it: a custom repository still derives its tag from the appVersion
    chart:
      appVersion: v1.2.3
    set:
      image:
        repository: registry.example.com/topograph
        tag: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/topograph:v1.2.3
        template: templates/deployment.yaml

  - it: injects a fully custom image from a private registry
    set:
      image:
        repository: private.registry.io/team/topograph
        tag: 2024.10.1-rc3
        pullPolicy: Always
      imagePullSecrets:
        - name: private-registry
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: private.registry.io/team/topograph:2024.10.1-rc3
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: private-registry
        template: templates/deployment.yaml

  - it: GCP workload identity federation wires the credentials env and volumes
    set:
      provider:
        name: gcp
        params:
          workloadIdentityFederation:
            credentialsConfigmap: gcp-creds
            audience: //iam.googleapis.com/projects/1/locations/global/workloadIdentityPools/p/providers/pr
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOOGLE_APPLICATION_CREDENTIALS
            value: /etc/topograph/gcp/credentials-config.json
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: credentials-config
            configMap:
              name: gcp-creds
        template: templates/deployment.yaml

  - it: GCP service account keys mount the secret-backed credentials file
    set:
      provider:
        name: gcp
        params:
          serviceAccountKeysSecret: gcp-sa-keys
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOOGLE_APPLICATION_CREDENTIALS
            value: /etc/topograph/gcp/service-account-keys.json
        template: templates/deployment.yaml

  - it: carries the standard recommended labels and selector
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: topograph
        template: templates/deployment.yaml
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
        template: templates/deployment.yaml
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: topograph
        template: templates/deployment.yaml
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: chart-ci
        template: templates/deployment.yaml

  - it: wires the service account and a config checksum annotation
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: chart-ci-topograph
        template: templates/deployment.yaml
      - isNotNullOrEmpty:
          path: spec.template.metadata.annotations["checksum/config"]
        template: templates/deployment.yaml

  - it: uses an existing service account when creation is disabled
    set:
      serviceAccount:
        create: false
        name: existing-topograph-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-topograph-sa
        template: templates/deployment.yaml

  - it: exposes the container port from the top-level service port
    set:
      service:
        port: 30000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 30000
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
        template: templates/deployment.yaml

  - it: injects the node-data-broker coordinates as environment variables
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_DATA_BROKER_NAME
            value: chart-ci-topograph-node-data-broker
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_DATA_BROKER_NAMESPACE
            value: topograph
        template: templates/deployment.yaml

  - it: injects the default NFD namespace for the nfd engine
    set:
      engine:
        name: nfd
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NFD_NAMESPACE
            value: node-feature-discovery
        template: templates/deployment.yaml

  - it: injects the configured NFD namespace
    set:
      engine:
        name: nfd
      nfdNamespace: custom-nfd
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NFD_NAMESPACE
            value: custom-nfd
        template: templates/deployment.yaml

  - it: injects the configured Kubernetes client limits
    set:
      kubeClient:
        qps: 50
        burst: 100
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBE_QPS
            value: "50"
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBE_BURST
            value: "100"
        template: templates/deployment.yaml

  - it: supports configuring only one Kubernetes client limit
    set:
      kubeClient:
        qps: 50
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBE_QPS
            value: "50"
        template: templates/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBE_BURST
          any: true
        template: templates/deployment.yaml

  - it: omits the node-data-broker coordinates when the broker is disabled
    set:
      nodeDataBroker:
        enabled: false
      env:
        FOO: BAR
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FOO
            value: BAR
        template: templates/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_DATA_BROKER_NAME
        template: templates/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_DATA_BROKER_NAMESPACE
        template: templates/deployment.yaml

  - it: passes the verbosity flag
    set:
      verbosity: 5
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: -v=5
        template: templates/deployment.yaml

  - it: renders user-supplied environment variables, initContainers, and lifecycle
    set:
      env:
        FOO: BAR
      initContainers:
        - name: test-init
          image: busybox:latest
          command:
            - sh
            - -c
            - "true"
      lifecycle:
        preStop:
          exec:
            command:
              - sh
              - -c
              - "true"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FOO
            value: BAR
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: test-init
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command[2]
          value: "true"
        template: templates/deployment.yaml

  - it: mounts a credentials secret volume when configured
    set:
      config:
        credentialsSecret: topograph-creds
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: credentials
            secret:
              secretName: topograph-creds
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: credentials
            mountPath: /etc/topograph/credentials
            readOnly: true
        template: templates/deployment.yaml

  - it: propagates pod metadata, scheduling, and image pull secrets
    set:
      podAnnotations:
        prometheus.io/scrape: "true"
      podLabels:
        team: platform
      imagePullSecrets:
        - name: ghcr-creds
      nodeSelector:
        disktype: ssd
      tolerations:
        - key: dedicated
          operator: Equal
          value: topograph
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
        template: templates/deployment.yaml
      - equal:
          path: spec.template.metadata.labels["team"]
          value: platform
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: ghcr-creds
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd
        template: templates/deployment.yaml
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: topograph
            effect: NoSchedule
        template: templates/deployment.yaml

  - it: an explicit image tag overrides the appVersion, with its pull policy
    chart:
      appVersion: v1.2.3
    set:
      image:
        repository: example.com/topograph
        tag: v9.9.9
        pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.com/topograph:v9.9.9
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
        template: templates/deployment.yaml
