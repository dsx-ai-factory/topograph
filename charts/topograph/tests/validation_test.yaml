suite: values validation
# topograph.validation is invoked from templates/deployment.yaml, so failures
# surface when that template is rendered.
templates:
  - templates/deployment.yaml
release:
  name: chart-ci
  namespace: topograph
tests:
  - it: rejects ingress and gatewayAPI enabled together
    set:
      ingress:
        enabled: true
      gatewayAPI:
        enabled: true
        parentRefs:
          - name: gw
    asserts:
      - failedTemplate:
          errorMessage: "ingress.enabled and gatewayAPI.enabled are mutually exclusive; deploying both routing resources against the same Service is almost always a misconfiguration. Pick one."

  - it: rejects gatewayAPI enabled without parentRefs
    set:
      gatewayAPI:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "gatewayAPI.enabled=true requires at least one entry in gatewayAPI.parentRefs referencing the existing Gateway resource this HTTPRoute should attach to. See charts/topograph/values.k8s.gateway-api-example.yaml for a complete example."

  - it: rejects GCP service account keys and workload identity federation together
    set:
      provider:
        name: gcp
        params:
          serviceAccountKeysSecret: keys
          workloadIdentityFederation:
            credentialsConfigmap: cm
            audience: aud
    asserts:
      - failedTemplate:
          errorMessage: "serviceAccountKeysSecret and workloadIdentityFederation in provider.params are mutually exclusive"

  - it: rejects incomplete GCP workload identity federation config
    set:
      provider:
        name: gcp
        params:
          workloadIdentityFederation:
            audience: aud
    asserts:
      - failedTemplate:
          errorMessage: "workloadIdentityFederation requires both credentialsConfigmap and audience"

  - it: rejects GCP workload identity federation without an audience
    set:
      provider:
        name: gcp
        params:
          workloadIdentityFederation:
            credentialsConfigmap: cm
    asserts:
      - failedTemplate:
          errorMessage: "workloadIdentityFederation requires both credentialsConfigmap and audience"

  - it: rejects overriding the chart-managed NFD namespace environment variable
    set:
      engine:
        name: nfd
      env:
        NFD_NAMESPACE: other-nfd
    asserts:
      - failedTemplate:
          errorMessage: "env.NFD_NAMESPACE is managed by the chart for the nfd engine; configure nfdNamespace instead"

  - it: rejects accelerator output customization with an accelerator domain source label
    set:
      engine:
        name: k8s
        params:
          acceleratorLabel: example.com/output-domain
          acceleratorDomainSourceLabel: example.com/source-domain
    asserts:
      - failedTemplate:
          errorMessage: "engine.params.acceleratorLabel and engine.params.acceleratorDomainSourceLabel cannot be set together for the k8s engine"

  - it: rejects overriding the chart-managed Kubernetes QPS environment variable
    set:
      env:
        KUBE_QPS: "50"
    asserts:
      - failedTemplate:
          errorMessage: "env.KUBE_QPS is managed by the chart; configure kubeClient.qps instead"

  - it: rejects overriding the chart-managed Kubernetes burst environment variable
    set:
      env:
        KUBE_BURST: "100"
    asserts:
      - failedTemplate:
          errorMessage: "env.KUBE_BURST is managed by the chart; configure kubeClient.burst instead"

  - it: rejects an unsupported InfiniBand accelerator source
    set:
      provider:
        name: infiniband-k8s
        params:
          accelerator:
            source: invalid
    asserts:
      - failedTemplate:
          errorMessage: 'unsupported provider.params.accelerator.source "invalid"'

  - it: rejects a non-empty InfiniBand accelerator section without source
    set:
      provider:
        name: infiniband-k8s
        params:
          accelerator:
            kubernetesLabel:
              key: nvidia.com/gpu.clique
    asserts:
      - failedTemplate:
          errorMessage: "provider.params.accelerator.source must be set when provider.params.accelerator is present"

  - it: rejects the Kubernetes label accelerator source without a key
    set:
      provider:
        name: infiniband-k8s
        params:
          accelerator:
            source: kubernetes-label
    asserts:
      - failedTemplate:
          errorMessage: "provider.params.accelerator.kubernetesLabel.key must be set for source kubernetes-label"

  - it: rejects the Kubernetes label accelerator source for infiniband-bm
    set:
      provider:
        name: infiniband-bm
        params:
          accelerator:
            source: kubernetes-label
            kubernetesLabel:
              key: nvidia.com/gpu.clique
    asserts:
      - failedTemplate:
          errorMessage: "provider.params.accelerator.source kubernetes-label is not supported by infiniband-bm"

  - it: rejects a DRA label accelerator source without a key
    set:
      provider:
        name: dra
        params:
          accelerator:
            source: kubernetes-label
    asserts:
      - failedTemplate:
          errorMessage: "provider.params.accelerator.kubernetesLabel.key must be set for source kubernetes-label"

  - it: rejects a non-label accelerator source for DRA
    set:
      provider:
        name: dra
        params:
          accelerator:
            source: none
    asserts:
      - failedTemplate:
          errorMessage: "provider.params.accelerator.source must be kubernetes-label for the dra provider"
