suite: node-observer rbac
release:
  name: chart-ci
  namespace: topograph
tests:
  - it: grants pod and broker DaemonSet watch when enabled
    templates:
      - templates/nodeObserver/rbac.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [pods]
              verbs: [list, watch]
            - apiGroups: [apps]
              resources: [daemonsets]
              verbs: [list, watch]

  - it: grants node watch when trigger.nodeSelector is set
    templates:
      - templates/nodeObserver/rbac.yaml
    set:
      nodeObserver:
        topograph:
          trigger:
            nodeSelector:
              accelerator: "true"
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [pods]
              verbs: [list, watch]
            - apiGroups: [apps]
              resources: [daemonsets]
              verbs: [list, watch]
            - apiGroups: [""]
              resources: [nodes]
              verbs: [list, watch]

  - it: omits DaemonSet watch when the broker is disabled
    templates:
      - templates/nodeObserver/rbac.yaml
    set:
      nodeDataBroker:
        enabled: false
    documentIndex: 0
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [pods]
              verbs: [list, watch]

  - it: binds the role to its own service account
    templates:
      - templates/nodeObserver/rbac.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: chart-ci-topograph-node-observer
      - equal:
          path: roleRef.apiGroup
          value: rbac.authorization.k8s.io
      - equal:
          path: subjects[0].name
          value: chart-ci-topograph-node-observer

  - it: binds RBAC to an existing service account
    templates:
      - templates/nodeObserver/rbac.yaml
    set:
      nodeObserver:
        serviceAccount:
          create: false
          name: existing-node-observer-sa
    documentIndex: 1
    asserts:
      - equal:
          path: roleRef.name
          value: chart-ci-topograph-node-observer
      - equal:
          path: subjects[0].name
          value: existing-node-observer-sa

  - it: rejects a missing existing service account name
    templates:
      - templates/nodeObserver/rbac.yaml
    set:
      nodeObserver:
        serviceAccount:
          create: false
          name: ""
    asserts:
      - failedTemplate:
          errorMessage: "nodeObserver.serviceAccount.name must be set when nodeObserver.serviceAccount.create=false"

  - it: is omitted when rbac.create is false
    templates:
      - templates/nodeObserver/rbac.yaml
    set:
      nodeObserver:
        rbac:
          create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: watches nodes for the kubernetes provider without a trigger selector
    templates:
      - templates/nodeObserver/rbac.yaml
    set:
      provider.name: kubernetes
      provider.params.topologyLabels: [rack]
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list, watch]

  - it: watches configured node labels for other providers without a selector
    templates:
      - templates/nodeObserver/rbac.yaml
    set:
      provider.name: test
      nodeObserver.topograph.trigger.nodeLabels: [rack]
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list, watch]

  - it: restores provider label defaults and node RBAC for a null override
    templates:
      - templates/nodeObserver/rbac.yaml
      - templates/nodeObserver/configmap.yml
    set:
      provider.name: kubernetes
      provider.params.topologyLabels: [rack]
      nodeObserver.topograph.trigger.nodeLabels: null
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list, watch]
        template: templates/nodeObserver/rbac.yaml
        documentIndex: 0
      - matchRegex:
          path: data["node-observer-config.yaml"]
          pattern: 'nodeLabels:\n\s+- rack'
        template: templates/nodeObserver/configmap.yml

  - it: preserves an explicit empty label override without node RBAC
    templates:
      - templates/nodeObserver/rbac.yaml
      - templates/nodeObserver/configmap.yml
    set:
      provider.name: kubernetes
      provider.params.topologyLabels: [rack]
      nodeObserver.topograph.trigger.nodeLabels: []
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list, watch]
        template: templates/nodeObserver/rbac.yaml
        documentIndex: 0
      - matchRegex:
          path: data["node-observer-config.yaml"]
          pattern: 'nodeLabels: \[\]'
        template: templates/nodeObserver/configmap.yml

  - it: watches nodes when only readiness changes are requested
    templates:
      - templates/nodeObserver/rbac.yaml
    set:
      provider.name: test
      nodeObserver.topograph.trigger.nodeReadiness: true
    documentIndex: 0
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [nodes]
            verbs: [list, watch]
