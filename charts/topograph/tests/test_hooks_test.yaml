suite: helm test hook pods
templates:
  - templates/tests/test-healthz.yaml
  - templates/tests/test-metrics.yaml
release:
  name: chart-ci
  namespace: topograph
tests:
  - it: renders the healthz probe pod as a helm test hook
    templates:
      - templates/tests/test-healthz.yaml
    asserts:
      - isKind:
          of: Pod
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test

  - it: renders the metrics probe pod as a helm test hook
    templates:
      - templates/tests/test-metrics.yaml
    asserts:
      - isKind:
          of: Pod
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test

  - it: disables service account token automount on both probe pods
    asserts:
      - equal:
          path: spec.automountServiceAccountToken
          value: false

  - it: sets the default container resources on both probe pods
    asserts:
      - equal:
          path: spec.containers[0].resources
          value:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 16Mi

  - it: renders tests.resources overrides on both probe pods
    set:
      tests:
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 32Mi
    asserts:
      - equal:
          path: spec.containers[0].resources
          value:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 32Mi

  - it: are omitted when tests.enabled is false
    set:
      tests:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
