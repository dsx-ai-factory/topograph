{{- /*
Namespaced RBAC of the gpu-nic-rail-mapping plugin. Pod and pods/exec access is
granted only in the GPU Operator namespace and never through a
ClusterRoleBinding. Reading the broker's own Node is covered by the broker
ClusterRole.
*/ -}}
{{- if and .Values.nodeDataBroker.enabled .Values.nodeDataBroker.rbac.create (eq (include "nodeMetadata.gpuNicRailMapping.enabled" .) "true") }}
{{- $gpu := .Values.nodeMetadata.plugins.gpuNicRailMapping.gpuSource }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nodeDataBroker.rbacName" . }}-gpu-nic-rail
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodeDataBroker.labels" . | nindent 4 }}
rules:
- apiGroups: [topograph.run]
  resources: [nodegpunicrailmappings]
  verbs: [get, create, delete]
- apiGroups: [topograph.run]
  resources: [nodegpunicrailmappings/status]
  verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nodeDataBroker.rbacName" . }}-gpu-nic-rail
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodeDataBroker.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "nodeDataBroker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "nodeDataBroker.rbacName" . }}-gpu-nic-rail
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nodeDataBroker.rbacName" . }}-gpu-nic-rail-gpu
  namespace: {{ $gpu.gpuOperatorNamespace }}
  labels:
    {{- include "nodeDataBroker.labels" . | nindent 4 }}
rules:
- apiGroups: [apps]
  resources: [daemonsets]
  resourceNames: [{{ $gpu.daemonSet | quote }}]
  verbs: [get]
- apiGroups: [""]
  resources: [pods]
  verbs: [list]
- apiGroups: [""]
  resources: [pods/exec]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nodeDataBroker.rbacName" . }}-gpu-nic-rail-gpu
  namespace: {{ $gpu.gpuOperatorNamespace }}
  labels:
    {{- include "nodeDataBroker.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "nodeDataBroker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "nodeDataBroker.rbacName" . }}-gpu-nic-rail-gpu
  apiGroup: rbac.authorization.k8s.io
{{- end }}
