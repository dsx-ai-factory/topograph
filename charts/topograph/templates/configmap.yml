apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "topograph.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "topograph.labels" . | nindent 4 }}
data:
  topograph-config.yaml: |-
    http:
      port: {{ .Values.service.port }}
      ssl: false
    requestAggregationDelay: {{ .Values.config.requestAggregationDelay }}
    {{- if ne .Values.config.nodeMetadata nil }}
    nodeMetadata:
      {{- toYaml .Values.config.nodeMetadata | nindent 6 }}
    {{- end }}
    {{- if .Values.config.credentialsSecret }}
    credentialsPath: /etc/topograph/credentials/credentials.yaml
    {{- end }}
