{{- /*
The observer removes this release's NodeGPUNICRailMapping resources when the
plugin is disabled and reconciles stale ones, so it keeps this access even
while the plugin is disabled.
*/ -}}
{{- if .Values.nodeObserver.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nodeObserver.rbacName" . }}-gpu-nic-rail
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodeObserver.labels" . | nindent 4 }}
rules:
- apiGroups: [topograph.run]
  resources: [nodegpunicrailmappings]
  verbs: [get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nodeObserver.rbacName" . }}-gpu-nic-rail
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodeObserver.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "nodeObserver.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "nodeObserver.rbacName" . }}-gpu-nic-rail
  apiGroup: rbac.authorization.k8s.io
{{- end }}
