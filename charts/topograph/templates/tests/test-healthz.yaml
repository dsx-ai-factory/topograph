{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "topograph.fullname" . }}-test-healthz"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "topograph.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  # The probes only call the Topograph Service over HTTP, never the Kubernetes API.
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: healthz
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      image: "{{ .Values.tests.image.repository | default .Values.image.repository }}:{{ .Values.tests.image.tag | default .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      resources:
        {{- toYaml .Values.tests.resources | nindent 8 }}
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          wget -q -O /dev/null -T 10 \
            "http://{{ include "topograph.fullname" . }}:{{ .Values.service.port }}/healthz"
{{- end }}
