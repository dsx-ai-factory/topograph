# A Job of ${PODS} pods that Kueue admits through the queue ${STACK}. Each pod requests just over
# half of a worker's allocatable CPU (kueue_job computes CPU_REQUEST), so one node holds one pod and
# the placement is visible node by node, whatever the host size.
# Rendered with envsubst: NAME, STACK, PODS, CPU_REQUEST, ANNOTATION (kueue.x-k8s.io/podset-required-topology
# or -preferred-topology) and LEVEL (the node label that annotation points at).
apiVersion: batch/v1
kind: Job
metadata:
  name: ${NAME}
  namespace: tas-lab
  labels:
    kueue.x-k8s.io/queue-name: ${STACK}
spec:
  parallelism: ${PODS}
  completions: ${PODS}
  template:
    metadata:
      annotations:
        ${ANNOTATION}: ${LEVEL}
    spec:
      restartPolicy: Never
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: ${CPU_REQUEST}
              memory: 64Mi
