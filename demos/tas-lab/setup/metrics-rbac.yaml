# Lets a service account scrape the kube-scheduler /metrics endpoint.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-reader
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scheduler-metrics-reader
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scheduler-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scheduler-metrics-reader
subjects:
  - kind: ServiceAccount
    name: metrics-reader
    namespace: kube-system
