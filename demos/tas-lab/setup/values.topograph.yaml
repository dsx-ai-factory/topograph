# Topograph for the TAS lab: the test provider replays tests/models/tas-lab.yaml (two leaf
# switches under one spine) and the k8s engine writes fabric.topograph.run/tier-N on the
# four kind workers. setup/topograph.sh pulls the image named by TOPOGRAPH_IMG_URL and
# TOPOGRAPH_IMG_TAG (versions.env), loads it into kind, and adds image.repository and image.tag
# to a copy of this file before installing; the image must embed the tas-lab model.
image:
  pullPolicy: IfNotPresent

provider:
  name: test
  params:
    modelFileName: tas-lab.yaml
    generateResponseCode: 202
    topologyResponseCode: 200
engine:
  name: k8s

config:
  requestAggregationDelay: 2s

# Only label the workers, never the control plane.
nodeSelector:
  node-role.kubernetes.io/control-plane: ""
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

nodeObserver:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  topograph:
    trigger:
      nodeSelector:
        tas-lab: worker

nodeDataBroker:
  enabled: false
