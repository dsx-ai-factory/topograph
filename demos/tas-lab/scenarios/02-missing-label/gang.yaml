# A one-pod gang that must sit inside one accelerator.topograph.run/domain.
apiVersion: scheduling.k8s.io/v1beta1
kind: Workload
metadata:
  name: gang-domain
  namespace: tas-lab
spec:
  podGroupTemplates:
    - name: gang-domain
      schedulingPolicy:
        gang:
          minCount: 1
      schedulingConstraints:
        topology:
          - key: accelerator.topograph.run/domain
---
apiVersion: scheduling.k8s.io/v1beta1
kind: PodGroup
metadata:
  name: gang-domain
  namespace: tas-lab
spec:
  workloadRef:
    workloadName: gang-domain
    templateName: gang-domain
  schedulingPolicy:
    gang:
      minCount: 1
  schedulingConstraints:
    topology:
      - key: accelerator.topograph.run/domain
---
apiVersion: v1
kind: Pod
metadata:
  name: gang-domain-1
  namespace: tas-lab
spec:
  schedulingGroup:
    podGroupName: gang-domain
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 100m
