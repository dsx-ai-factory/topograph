# The same fabric keys without kubernetes.io/hostname as the last level.
apiVersion: kueue.x-k8s.io/v1beta2
kind: Topology
metadata:
  name: label-keys-no-hostname
spec:
  levels:
    - nodeLabel: fabric.topograph.run/tier-1
    - nodeLabel: fabric.topograph.run/tier-0
