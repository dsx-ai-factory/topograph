apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: required-tier1-fits
spec:
  description: |
    Given a Topology with levels tier-1 (spine) > tier-0 (leaf) > hostname, and workers where each spine holds two nodes and one pod fills a node.
    When a 2-pod Job asks for required tier-1 locality (all pods under one spine).
    Then Kueue admits the Job and both pods are Running on nodes that share one tier-1 value, that is one spine.
  bindings:
  # Unique per test, so a slow cleanup can never collide with the next case.
  - name: stack
    value: (join('-', ['cs', $namespace]))
  steps:
  # Make sure the workers carry the multi-tier labels (four leaves, two spines, three domains).
  - name: labels
    use:
      template: ../../templates/multitier-labels.yaml
  # Create the Kueue Topology (the levels under test), ResourceFlavor, ClusterQueue and LocalQueue.
  - name: stack
    use:
      template: ../../templates/stack.yaml
      with:
        bindings:
        - name: stack
          value: ($stack)
        - name: levels
          value:
            - nodeLabel: fabric.topograph.run/tier-1
            - nodeLabel: fabric.topograph.run/tier-0
            - nodeLabel: kubernetes.io/hostname
  # Submit a Job of 2 pods that asks Kueue for required topology on fabric.topograph.run/tier-1.
  - name: submit
    use:
      template: ../../templates/job.yaml
      with:
        bindings:
        - name: job
          value: job
        - name: stack
          value: ($stack)
        - name: pods
          value: 2
        - name: annotations
          value:
            kueue.x-k8s.io/podset-required-topology: fabric.topograph.run/tier-1
  # Assert Kueue admitted the Job and all of its pods are Ready.
  - name: admitted-and-running
    use:
      template: ../../templates/admitted.yaml
      with:
        bindings:
        - name: job
          value: job
        - name: pods
          value: 2
  # Assert the pods ran in one spine (one tier-1 value).
  - name: in-1-tier1
    use:
      template: ../../templates/spread-tier1.yaml
      with:
        bindings:
        - name: job
          value: job
        - name: count
          value: 1
