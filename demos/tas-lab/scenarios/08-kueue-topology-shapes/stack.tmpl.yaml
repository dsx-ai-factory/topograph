# A ResourceFlavor, ClusterQueue and LocalQueue (all named ${STACK}) over the Topology of the same
# name. Rendered by run.sh with envsubst: STACK and CPU_QUOTA
# (the workers' allocatable CPU, so the quota never limits a Job that fits).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: ${STACK}
spec:
  # The nodes this flavor covers. Kueue requires at least one label when topologyName is set.
  # The lab uses tas-lab=worker; on a real cluster use the label of your node pool.
  nodeLabels:
    tas-lab: worker
  topologyName: ${STACK}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: ${STACK}
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: ${STACK}
          resources:
            - name: cpu
              nominalQuota: ${CPU_QUOTA}
            - name: memory
              nominalQuota: 100Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: ${STACK}
  namespace: tas-lab
spec:
  clusterQueue: ${STACK}
