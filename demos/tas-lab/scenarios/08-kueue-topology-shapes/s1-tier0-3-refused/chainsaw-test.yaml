apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: s1-tier0-3-refused
spec:
  description: |
    Given the same shape and Topology.
    When a 3-pod Job asks for required tier-0 locality.
    Then Kueue does not admit it: a rack holds two nodes.
  bindings:
  # Unique per test, so a slow cleanup can never collide with the next case.
  - name: stack
    value: (join('-', ['cs', $namespace]))
  steps:
  # Have Topograph label the workers from tests/models/tas-lab.yaml; the default model is restored when the test ends.
  - name: topograph-labels
    use:
      template: ../../templates/topograph-labels.yaml
      with:
        bindings:
        - name: model
          value: tas-lab.yaml
        - name: params
          value: '{}'
  # Wait for the labels the test relies on to show up on a node.
  - name: labels-settled
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Node
          metadata:
            name: tas-lab-worker
            labels:
              fabric.topograph.run/tier-0: rack-a
  # Create the Kueue Topology (the levels under test), ResourceFlavor, ClusterQueue and LocalQueue.
  - name: stack
    use:
      template: ../../templates/stack.yaml
      with:
        bindings:
        - name: stack
          value: ($stack)
        - name: levels
          value:
            - nodeLabel: fabric.topograph.run/tier-1
            - nodeLabel: fabric.topograph.run/tier-0
            - nodeLabel: kubernetes.io/hostname
  # Submit a Job of 3 pods that asks Kueue for required topology on fabric.topograph.run/tier-0.
  - name: submit
    use:
      template: ../../templates/job.yaml
      with:
        bindings:
        - name: job
          value: job
        - name: stack
          value: ($stack)
        - name: pods
          value: 3
        - name: annotations
          value:
            kueue.x-k8s.io/podset-required-topology: fabric.topograph.run/tier-0
  # Assert Kueue did not admit the Job, and says why: "fit only 2 out of 3".
  - name: refused
    use:
      template: ../../templates/refused.yaml
      with:
        bindings:
        - name: job
          value: job
        - name: message
          value: fit only 2 out of 3
