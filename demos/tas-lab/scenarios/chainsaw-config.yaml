# Chainsaw settings for the TAS lab. The scenarios share one cluster and change the labels of
# every node, so they must run one at a time.
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: tas-lab
spec:
  execution:
    parallel: 1
  timeouts:
    apply: 30s
    assert: 90s
    cleanup: 60s
    delete: 30s
    error: 30s
    exec: 120s
