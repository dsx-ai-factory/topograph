# Two LeaderWorkerSet groups of 2 pods (baseline). Kueue admits each group as its own Workload and
# keeps its pods inside one fabric.topograph.run/tier-1 domain (required topology).
# Pods request a small share of a worker's CPU (CPU_REQUEST, set by run.sh), so without spreading nothing stops both groups from sharing a spine.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: spread-demo
  namespace: tas-lab
  labels:
    app: spread-demo
    kueue.x-k8s.io/queue-name: spreading
spec:
  replicas: 2
  leaderWorkerTemplate:
    size: 2
    workerTemplate:
      metadata:
        labels:
          app: spread-demo
        annotations:
          kueue.x-k8s.io/podset-required-topology: fabric.topograph.run/tier-1
      spec:
        containers:
          - name: pause
            image: registry.k8s.io/pause:3.10
            resources:
              requests:
                cpu: ${CPU_REQUEST}
                memory: 64Mi
