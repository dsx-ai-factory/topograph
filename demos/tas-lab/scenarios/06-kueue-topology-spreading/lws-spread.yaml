# Two LeaderWorkerSet groups of 2 pods (spread). Kueue admits each group as its own Workload and
# keeps its pods inside one fabric.topograph.run/tier-1 domain (required topology);
# the spreading annotation additionally keeps the two groups out of the same spine.
# Pods request 1 CPU, so without spreading nothing stops both groups from sharing a spine.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: spread-demo
  namespace: tas-lab
  labels:
    app: spread-demo
    kueue.x-k8s.io/queue-name: spreading
spec:
  replicas: 2
  leaderWorkerTemplate:
    size: 2
    workerTemplate:
      metadata:
        labels:
          app: spread-demo
        annotations:
          kueue.x-k8s.io/podset-required-topology: fabric.topograph.run/tier-1
          kueue.x-k8s.io/podset-topology-spreading: |
            {
              "workloadLabelSelectors": [{"key": "app", "operator": "In", "values": ["spread-demo"]}],
              "rules": [{"topologyKey": "fabric.topograph.run/tier-1", "maxShareAllowingPlacement": "0.5", "enforcementMode": "Required"}]
            }
      spec:
        containers:
          - name: pause
            image: registry.k8s.io/pause:3.10
            resources:
              requests:
                cpu: "1"
                memory: 64Mi
