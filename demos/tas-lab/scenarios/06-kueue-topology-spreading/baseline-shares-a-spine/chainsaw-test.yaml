apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: baseline-shares-a-spine
spec:
  description: |
    Given a Topology tier-1 > tier-0 > hostname and a LeaderWorkerSet of two groups of two pods, each group asking for required tier-1 locality, with small pods so that nothing but topology limits where they go.
    When it is submitted without the spreading annotation.
    Then Kueue admits both groups, each group stays inside one spine, and both groups share the same spine.
  bindings:
  # Unique per test, so a slow cleanup can never collide with the next case.
  - name: stack
    value: (join('-', ['cs', $namespace]))
  steps:
  # Make sure the workers carry the multi-tier labels (four leaves, two spines, three domains).
  - name: labels
    use:
      template: ../../templates/multitier-labels.yaml
  # Create the Kueue Topology (the levels under test), ResourceFlavor, ClusterQueue and LocalQueue.
  - name: stack
    use:
      template: ../../templates/stack.yaml
      with:
        bindings:
        - name: stack
          value: ($stack)
        - name: levels
          value:
            - nodeLabel: fabric.topograph.run/tier-1
            - nodeLabel: fabric.topograph.run/tier-0
            - nodeLabel: kubernetes.io/hostname
  # Submit a LeaderWorkerSet of two groups of two small pods with the topology annotation(s) below.
  - name: submit
    use:
      template: ../../templates/lws.yaml
      with:
        bindings:
        - name: stack
          value: ($stack)
        - name: annotations
          value:
            kueue.x-k8s.io/podset-required-topology: fabric.topograph.run/tier-1
  # Assert Kueue admitted each group as its own Workload.
  - name: both-groups-admitted
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ($namespace)
          # Kueue admits each group as its own Workload.
          (length(x_k8s_list($client, 'kueue.x-k8s.io/v1beta2', 'Workload', $namespace).items[?status.conditions[?type == 'Admitted' && status == 'True'] | [0]])): 2
  # Assert both pods of LeaderWorkerSet group 0 are Running.
  - name: group0-running
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ($namespace)
          (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?starts_with(metadata.name, 'spread-demo-0') && status.phase == 'Running'])): 2
  # Assert both pods of LeaderWorkerSet group 1 are Running.
  - name: group1-running
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ($namespace)
          (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?starts_with(metadata.name, 'spread-demo-1') && status.phase == 'Running'])): 2
  # Assert each group sits in one domain, and that the groups share it.
  - name: groups
    bindings:
    - name: workers
      value: (x_k8s_list($client, 'v1', 'Node', '').items[?metadata.labels."tas-lab" == 'worker'])
    - name: pods0
      value: (x_k8s_list($client, 'v1', 'Pod', $namespace).items[?starts_with(metadata.name, 'spread-demo-0')])
    - name: pods1
      value: (x_k8s_list($client, 'v1', 'Pod', $namespace).items[?starts_with(metadata.name, 'spread-demo-1')])
    - name: group0
      value: ($workers[?contains($pods0[*].spec.nodeName, metadata.name)].metadata.labels."fabric.topograph.run/tier-1")
    - name: group1
      value: ($workers[?contains($pods1[*].spec.nodeName, metadata.name)].metadata.labels."fabric.topograph.run/tier-1")
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ($namespace)
          # Each group sits in one domain; whether it is the same one is the point of the test.
          (length(keys(object_from_lists($group0, $group0)))): 1
          (length(keys(object_from_lists($group1, $group1)))): 1
          (join(',', keys(object_from_lists($group0, $group0))) == join(',', keys(object_from_lists($group1, $group1)))): true
