apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: on-domain
spec:
  description: |
    Given the same model (nvl-a fills spine-1; nvl-b and nvl-c are single nodes) and a 2-pod gang, one pod per node, constrained to one accelerator.topograph.run/domain.
    When the gang is submitted.
    Then it is placed in nvl-a: both pods are Running in one accelerator domain, which nests inside one spine.
  steps:
  # Make sure the workers carry the multi-tier labels (four leaves, two spines, three domains).
  - name: labels
    use:
      template: ../../templates/multitier-labels.yaml
  # Record the scheduler's placement metrics before the workload is submitted.
  - name: metrics-baseline
    use:
      template: ../../templates/scheduler-metrics-snapshot.yaml
  # Create the gang: a Workload and PodGroup (minCount 2, topology constraint accelerator.topograph.run/domain) and the Job whose pods, one per node, join it.
  - name: gang
    try:
    - apply:
        resource:
          apiVersion: scheduling.k8s.io/v1beta1
          kind: Workload
          metadata:
            name: on-domain
          spec:
            podGroupTemplates:
            - name: on-domain
              schedulingPolicy:
                gang:
                  minCount: 2
              schedulingConstraints:
                topology:
                - key: accelerator.topograph.run/domain
    - apply:
        resource:
          apiVersion: scheduling.k8s.io/v1beta1
          kind: PodGroup
          metadata:
            name: on-domain
          spec:
            workloadRef:
              workloadName: on-domain
              templateName: on-domain
            schedulingPolicy:
              gang:
                minCount: 2
            schedulingConstraints:
              topology:
              - key: accelerator.topograph.run/domain
    - apply:
        resource:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: on-domain
          spec:
            parallelism: 2
            completions: 2
            template:
              metadata:
                labels:
                  lab: on-domain
              spec:
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                    - topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          lab: on-domain
                schedulingGroup:
                  podGroupName: on-domain
                restartPolicy: Never
                containers:
                - name: pause
                  image: registry.k8s.io/pause:3.10
                  resources:
                    requests:
                      cpu: 100m
  # Assert all pods of the gang are Running.
  - name: running
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ($namespace)
          (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?starts_with(metadata.name, 'on-domain') && status.phase == 'Running'])): 2
  # Assert the scheduler placed the gang (PodGroupInitiallyScheduled is True).
  - name: decided
    try:
    - assert:
        resource:
          apiVersion: scheduling.k8s.io/v1beta1
          kind: PodGroup
          metadata:
            name: on-domain
          status:
            (conditions[?type == 'PodGroupInitiallyScheduled'].status): ['True']
  # Assert the pods ran in one accelerator domain.
  - name: in-1-domain
    bindings:
    - name: workers
      value: (x_k8s_list($client, 'v1', 'Node', '').items[?metadata.labels."tas-lab" == 'worker'])
    - name: pods
      value: (x_k8s_list($client, 'v1', 'Pod', $namespace).items[?starts_with(metadata.name, 'on-domain')])
    - name: values
      value: ($workers[?contains($pods[*].spec.nodeName, metadata.name)].metadata.labels."accelerator.topograph.run/domain")
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ($namespace)
          (length(keys(object_from_lists($values, $values)))): 1
  # Assert the pods ran in one spine (one tier-1 value).
  - name: in-1-spine
    bindings:
    - name: workers
      value: (x_k8s_list($client, 'v1', 'Node', '').items[?metadata.labels."tas-lab" == 'worker'])
    - name: pods
      value: (x_k8s_list($client, 'v1', 'Pod', $namespace).items[?starts_with(metadata.name, 'on-domain')])
    - name: spines
      value: ($workers[?contains($pods[*].spec.nodeName, metadata.name)].metadata.labels."fabric.topograph.run/tier-1")
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ($namespace)
          (length(keys(object_from_lists($spines, $spines)))): 1
  # Check the scheduler generated one candidate placement per accelerator domain (three).
  - name: placements-generated
    use:
      template: ../../templates/scheduler-metrics-delta.yaml
      with:
        bindings:
        - name: series
          value: '^scheduler_generated_placements_total'
        - name: mode
          value: exactly
        - name: value
          value: 3
  # Check exactly one placement (nvl-a) was feasible.
  - name: only-nvl-a-feasible
    use:
      template: ../../templates/scheduler-metrics-delta.yaml
      with:
        bindings:
        - name: series
          value: 'evaluations_total.*result="feasible"'
        - name: mode
          value: exactly
        - name: value
          value: 1
