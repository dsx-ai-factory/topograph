apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: on-tier0
spec:
  description: |
    Given the same model and a 2-pod gang, one pod per node, constrained to one fabric.topograph.run/tier-0 domain.
    When the gang is submitted.
    Then it is not placed: every leaf holds one node, so the PodGroup is not scheduled and both pods stay Pending.
  steps:
  # Make sure the workers carry the multi-tier labels (four leaves, two spines, three domains).
  - name: labels
    use:
      template: ../../templates/multitier-labels.yaml
  # Record the scheduler's placement metrics before the workload is submitted.
  - name: metrics-baseline
    use:
      template: ../../templates/scheduler-metrics-snapshot.yaml
  # Create the gang: a Workload and PodGroup (minCount 2, topology constraint fabric.topograph.run/tier-0) and the Job whose pods, one per node, join it.
  - name: gang
    try:
    - apply:
        resource:
          apiVersion: scheduling.k8s.io/v1beta1
          kind: Workload
          metadata:
            name: on-tier0
          spec:
            podGroupTemplates:
            - name: on-tier0
              schedulingPolicy:
                gang:
                  minCount: 2
              schedulingConstraints:
                topology:
                - key: fabric.topograph.run/tier-0
    - apply:
        resource:
          apiVersion: scheduling.k8s.io/v1beta1
          kind: PodGroup
          metadata:
            name: on-tier0
          spec:
            workloadRef:
              workloadName: on-tier0
              templateName: on-tier0
            schedulingPolicy:
              gang:
                minCount: 2
            schedulingConstraints:
              topology:
              - key: fabric.topograph.run/tier-0
    - apply:
        resource:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: on-tier0
          spec:
            parallelism: 2
            completions: 2
            template:
              metadata:
                labels:
                  lab: on-tier0
              spec:
                affinity:
                  podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                    - topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          lab: on-tier0
                schedulingGroup:
                  podGroupName: on-tier0
                restartPolicy: Never
                containers:
                - name: pause
                  image: registry.k8s.io/pause:3.10
                  resources:
                    requests:
                      cpu: 100m
  # Wait for the scheduler's decision: PodGroupInitiallyScheduled is False, the gang was not placed.
  - name: decided
    try:
    - assert:
        resource:
          apiVersion: scheduling.k8s.io/v1beta1
          kind: PodGroup
          metadata:
            name: on-tier0
          status:
            (conditions[?type == 'PodGroupInitiallyScheduled'].status): ['False']
  # Give the scheduler time to retry, so that "still Pending" is not just the first instant.
  - name: settle
    try:
    - sleep:
        duration: 8s
  # Assert the pods are still Pending: the gang was not placed.
  - name: stays-pending
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ($namespace)
          (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?starts_with(metadata.name, 'on-tier0') && status.phase == 'Pending'])): 2
  # Check the scheduler found placements infeasible.
  - name: infeasible-evaluations
    use:
      template: ../../templates/scheduler-metrics-delta.yaml
      with:
        bindings:
        - name: series
          value: 'evaluations_total.*result="infeasible"'
        - name: mode
          value: at-least
        - name: value
          value: 1
  # Check every attempt generated one placement per leaf (a multiple of four).
  - name: placement-per-leaf
    use:
      template: ../../templates/scheduler-metrics-delta.yaml
      with:
        bindings:
        - name: series
          value: '^scheduler_generated_placements_total'
        - name: mode
          value: multiple-of
        - name: value
          value: 4
