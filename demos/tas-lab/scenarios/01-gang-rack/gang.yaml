# A 4-pod gang (minCount 4) that must fit inside one fabric.topograph.run/tier-0 domain.
apiVersion: scheduling.k8s.io/v1beta1
kind: Workload
metadata:
  name: gang-rack
  namespace: tas-lab
spec:
  podGroupTemplates:
    - name: gang-rack
      schedulingPolicy:
        gang:
          minCount: 4
      schedulingConstraints:
        topology:
          - key: fabric.topograph.run/tier-0
---
apiVersion: scheduling.k8s.io/v1beta1
kind: PodGroup
metadata:
  name: gang-rack
  namespace: tas-lab
spec:
  workloadRef:
    workloadName: gang-rack
    templateName: gang-rack
  schedulingPolicy:
    gang:
      minCount: 4
  schedulingConstraints:
    topology:
      - key: fabric.topograph.run/tier-0
---
apiVersion: v1
kind: Pod
metadata:
  name: gang-rack-1
  namespace: tas-lab
spec:
  schedulingGroup:
    podGroupName: gang-rack
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 100m
---
apiVersion: v1
kind: Pod
metadata:
  name: gang-rack-2
  namespace: tas-lab
spec:
  schedulingGroup:
    podGroupName: gang-rack
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 100m
---
apiVersion: v1
kind: Pod
metadata:
  name: gang-rack-3
  namespace: tas-lab
spec:
  schedulingGroup:
    podGroupName: gang-rack
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 100m
---
apiVersion: v1
kind: Pod
metadata:
  name: gang-rack-4
  namespace: tas-lab
spec:
  schedulingGroup:
    podGroupName: gang-rack
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 100m
