# Two LeaderWorkerSet groups of 2 pods (baseline), written only in terms of the rack alias
# ${RACK_KEY}: each group must stay inside one rack.
# Rendered by run.sh with envsubst (RACK_KEY, CPU_REQUEST: a small share of a worker's CPU, so
# both groups fit one rack, which is one node, when spreading is off).
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: spread-demo
  namespace: tas-lab
  labels:
    app: spread-demo
    kueue.x-k8s.io/queue-name: aliases
spec:
  replicas: 2
  leaderWorkerTemplate:
    size: 2
    workerTemplate:
      metadata:
        labels:
          app: spread-demo
        annotations:
          kueue.x-k8s.io/podset-required-topology: ${RACK_KEY}
      spec:
        containers:
          - name: pause
            image: registry.k8s.io/pause:3.10
            resources:
              requests:
                cpu: ${CPU_REQUEST}
                memory: 64Mi
