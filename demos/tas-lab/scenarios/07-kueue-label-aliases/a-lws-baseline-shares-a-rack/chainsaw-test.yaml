apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: a-lws-baseline-shares-a-rack
spec:
  description: |
    Given the alias mapping A and a LeaderWorkerSet of two groups of two small pods, written only in terms of the rack alias (required topology on rack).
    When it is submitted without spreading.
    Then both groups are admitted and Running, each group in one rack, and both groups share a rack (a rack is one node and the pods are small).
  bindings:
  # Unique per test, so a slow cleanup can never collide with the next case.
  - name: stack
    value: (join('-', ['cs', $namespace]))
  steps:
  # Have Topograph label the workers from tests/models/tas-lab-multitier.yaml (the k8s engine writes the alias keys, fabricLabels); the default model is restored when the test ends.
  - name: topograph-labels
    use:
      template: ../../templates/topograph-labels.yaml
      with:
        bindings:
        - name: model
          value: tas-lab-multitier.yaml
        - name: params
          value: '{"fabricLabels":["cloud.provider.com/topology-rack","cloud.provider.com/topology-block"]}'
  # Wait for the labels the test relies on to show up on a node.
  - name: labels-settled
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Node
          metadata:
            name: tas-lab-worker
            labels:
              cloud.provider.com/topology-rack: leaf-1
              cloud.provider.com/topology-block: spine-1
    cleanup:
    - script:
        env:
        - name: KUBE_CONTEXT
          value: chainsaw
        content: |
          bash -c 'for key in cloud.provider.com/topology-rack cloud.provider.com/topology-block example.com/leaf; do kubectl label nodes -l tas-lab=worker "$key-" >/dev/null 2>&1 || true; done'
  # Assert all four workers carry the rack alias label.
  - name: all-nodes-have-the-rack-alias
    bindings:
    - name: workers
      value: (x_k8s_list($client, 'v1', 'Node', '').items[?metadata.labels."tas-lab" == 'worker'])
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ($namespace)
          (length($workers[?contains(keys(metadata.labels), 'cloud.provider.com/topology-rack')])): 4
  # Assert the default fabric.topograph.run/tier-0 label is gone: the aliases replaced it.
  - name: default-tier-labels-gone
    bindings:
    - name: workers
      value: (x_k8s_list($client, 'v1', 'Node', '').items[?metadata.labels."tas-lab" == 'worker'])
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ($namespace)
          (length($workers[?contains(keys(metadata.labels), 'fabric.topograph.run/tier-0')])): 0
  # Create the Kueue Topology (the levels under test), ResourceFlavor, ClusterQueue and LocalQueue.
  - name: stack
    use:
      template: ../../templates/stack.yaml
      with:
        bindings:
        - name: stack
          value: ($stack)
        - name: levels
          value:
            - nodeLabel: cloud.provider.com/topology-block
            - nodeLabel: cloud.provider.com/topology-rack
            - nodeLabel: kubernetes.io/hostname
  # Submit a LeaderWorkerSet of two groups of two small pods with the topology annotation(s) below.
  - name: submit
    use:
      template: ../../templates/lws.yaml
      with:
        bindings:
        - name: stack
          value: ($stack)
        - name: annotations
          value:
            kueue.x-k8s.io/podset-required-topology: cloud.provider.com/topology-rack
  # Assert Kueue admitted each group as its own Workload.
  - name: both-groups-admitted
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ($namespace)
          # Kueue admits each group as its own Workload.
          (length(x_k8s_list($client, 'kueue.x-k8s.io/v1beta2', 'Workload', $namespace).items[?status.conditions[?type == 'Admitted' && status == 'True'] | [0]])): 2
  # Assert both pods of LeaderWorkerSet group 0 are Running.
  - name: group0-running
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ($namespace)
          (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?starts_with(metadata.name, 'spread-demo-0') && status.phase == 'Running'])): 2
  # Assert both pods of LeaderWorkerSet group 1 are Running.
  - name: group1-running
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ($namespace)
          (length(x_k8s_list($client, 'v1', 'Pod', $namespace).items[?starts_with(metadata.name, 'spread-demo-1') && status.phase == 'Running'])): 2
  # Assert each group sits in one domain, and that the groups share it.
  - name: groups
    bindings:
    - name: workers
      value: (x_k8s_list($client, 'v1', 'Node', '').items[?metadata.labels."tas-lab" == 'worker'])
    - name: pods0
      value: (x_k8s_list($client, 'v1', 'Pod', $namespace).items[?starts_with(metadata.name, 'spread-demo-0')])
    - name: pods1
      value: (x_k8s_list($client, 'v1', 'Pod', $namespace).items[?starts_with(metadata.name, 'spread-demo-1')])
    - name: group0
      value: ($workers[?contains($pods0[*].spec.nodeName, metadata.name)].metadata.labels."cloud.provider.com/topology-rack")
    - name: group1
      value: ($workers[?contains($pods1[*].spec.nodeName, metadata.name)].metadata.labels."cloud.provider.com/topology-rack")
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ($namespace)
          # Each group sits in one domain; whether it is the same one is the point of the test.
          (length(keys(object_from_lists($group0, $group0)))): 1
          (length(keys(object_from_lists($group1, $group1)))): 1
          (join(',', keys(object_from_lists($group0, $group0))) == join(',', keys(object_from_lists($group1, $group1)))): true
